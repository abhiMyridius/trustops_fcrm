[mypy]
python_version = 3.13
mypy_path = src
namespace_packages = True
explicit_package_bases = True
disallow_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True

; mypy --strict per ADR-21 / design A §1.2 on the packages where correctness
; matters most this week; the rest still gets disallow_untyped_defs.
[mypy-fcrm_scoring.*]
strict = True
[mypy-fcrm_contracts.*]
strict = True
[mypy-fcrm_guardrails.*]
strict = True
[mypy-fcrm_caseflow.*]
strict = True
[mypy-evoq_ingestion.*]
strict = True
[mypy-evoq_context.*]
strict = True

; third-party libs without bundled stubs
[mypy-faststream.*]
ignore_missing_imports = True
[mypy-pydantic_ai.*]
ignore_missing_imports = True
[mypy-presidio_analyzer.*]
ignore_missing_imports = True
