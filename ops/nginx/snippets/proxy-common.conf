# Common proxy settings for every gateway location. Included per location
# because nginx drops inherited proxy_set_header as soon as a location sets
# one of its own. The client's Authorization header is forwarded unchanged
# (nginx passes request headers through by default). Only array directives
# (proxy_set_header) live here; timeouts are set at server level so a
# location can override them without a "duplicate directive" error.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
