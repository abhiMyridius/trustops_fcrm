# G1 gateway (nginx 1.27) — design A §8.3, BUILD-PLAN §3.2. Port 8080.
#
# Routing (the gateway strips nothing: every service mounts its routes under
# the same public prefix through APP_ROOT_PATH):
#   /api/fcrm/auth/*                                   -> identity:8000  (no auth_request; identity enforces)
#   /api/fcrm/{cases,queue,conditions,reflags,
#             dashboard,monitor,stream}*               -> case:8001      (S1 is mounted at /api/fcrm)
#   /api/fcrm/scoring/*                                -> scoring:8002
#   /api/fcrm/policy/*                                 -> policy:8003
#   /api/fcrm/audit/*                                  -> audit:8004
#   /api/fcrm/decision/*                               -> decision:8005
#   /api/fcrm/**/internal/*                            -> 404 (fcrm_service routes are never public)
#   /api/*  (anything else)                            -> 404 problem+json
#   /                                                  -> web (static build, or the vite dev server)
#
# Authentication: every non-auth API location runs `auth_request /_auth`,
# which calls identity's POST /api/fcrm/auth/core/validate with the caller's
# Authorization header. 2xx passes; 401/403 are answered here as
# problem+json before the request reaches a service; identity unreachable is
# a 503. Route AUTHORIZATION is not done here: nginx OSS has no OPA client,
# so each service asks OPA (fcrm_common.authz) for the matched route
# template — the same sidecar, fail closed (design A §8.3).
#
# Upstreams are variables resolved per request through Docker's DNS
# (127.0.0.11), so the gateway starts — and `nginx -t` passes — even while
# an upstream container is still building or restarting. A missing upstream
# is a 502/503 for that route only, never a gateway crash loop.
#
# Web, two modes (snippets/web-upstream*.conf sets $web_upstream):
#   default (docker-compose.yaml): web:80, the nginx-served static build of
#     src/web (Dockerfile owned by the web lane).
#   dev (compose.dev.yaml): web:5173, the vite dev server; the dev snippet is
#     bind-mounted over the default one and adds the HMR websocket upgrade.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

# No query strings in the access log ($uri, not $request): the SSE token
# fallback below must never land in a log line. No Authorization header.
log_format fcrm_json escape=json
  '{"ts":"$time_iso8601","service":"gateway","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"ms":"$request_time","upstream":"$upstream_addr",'
  '"upstream_ms":"$upstream_response_time","request_id":"$request_id",'
  '"traceparent":"$http_traceparent","ua":"$http_user_agent"}';

# Rate limits (design A §2.1.2, §8.1, §8.3).
limit_req_zone $http_authorization zone=fcrm_user:10m rate=20r/s;
limit_req_zone $http_authorization zone=fcrm_items:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=fcrm_login:10m rate=10r/m;
limit_req_status 429;

# Upgrade only when the client asks (vite HMR websocket); otherwise an empty
# Connection header, so SSE and API calls keep an HTTP/1.1 keep-alive upstream.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# SSE only: EventSource cannot set headers, so a stream location may take the
# bearer token from ?access_token= when no Authorization header is present.
# The value is captured into $fcrm_sse_auth by `set` in the stream location
# (rewrite phase of the MAIN request, where $arg_access_token is the
# client's), and the /_auth subrequest — which shares the parent's variables
# but has no query string of its own — reads it back through
# $fcrm_validate_authorization.
map $http_authorization $sse_authorization {
  ''      "Bearer $arg_access_token";
  default $http_authorization;
}

map $fcrm_sse_auth $fcrm_validate_authorization {
  ''      $http_authorization;
  default $fcrm_sse_auth;
}

server {
  listen 8080 default_server;
  # Alpine resolves `localhost` to ::1 first; without this the compose
  # healthcheck (wget http://localhost:8080/healthz) is refused (D-26).
  listen [::]:8080 default_server;
  server_name _;

  access_log /dev/stdout fcrm_json;
  error_log /dev/stderr warn;

  server_tokens off;
  client_max_body_size 1m;

  # Upstream defaults (design A §10.3: connect 2 s, read 10–30 s); SSE and
  # upload locations override.
  proxy_http_version 1.1;
  proxy_connect_timeout 2s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # Security headers (static and API). `always` so they ride error pages too.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Upstreams (compose service names; ports per ADR-20).
  set $up_identity "identity:8000";
  set $up_case     "case:8001";
  set $up_scoring  "scoring:8002";
  set $up_policy   "policy:8003";
  set $up_audit    "audit:8004";
  set $up_decision "decision:8005";
  include /etc/nginx/snippets/web-upstream.conf;   # sets $web_upstream

  # $fcrm_sse_auth is set only in the stream locations. It is deliberately
  # not initialised here: server-level `set` re-runs inside the /_auth
  # subrequest and would overwrite the value the parent captured.
  uninitialized_variable_warn off;

  # ── gateway health (static; compose healthcheck and `make up` wait) ──────
  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }

  # ── auth subrequest ───────────────────────────────────────────────────────
  location = /_auth {
    internal;
    proxy_method POST;
    proxy_pass http://$up_identity/api/fcrm/auth/core/validate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $fcrm_validate_authorization;
    proxy_set_header X-Original-URI $uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header traceparent $http_traceparent;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # ── problem+json error pages (RFC 9457, design A §10.2) ───────────────────
  location @problem_401 {
    default_type application/problem+json;
    return 401 '{"type":"https://trustops.local/errors/unauthorized","title":"Unauthorized","status":401,"code":"unauthorized","detail":"A valid access token is required","instance":"$uri"}';
  }
  location @problem_403 {
    default_type application/problem+json;
    return 403 '{"type":"https://trustops.local/errors/forbidden","title":"Forbidden","status":403,"code":"forbidden","detail":"The token was rejected","instance":"$uri"}';
  }
  location @problem_404 {
    default_type application/problem+json;
    return 404 '{"type":"https://trustops.local/errors/not_found","title":"Not found","status":404,"code":"not_found","instance":"$uri"}';
  }
  location @problem_413 {
    default_type application/problem+json;
    return 413 '{"type":"https://trustops.local/errors/payload_too_large","title":"Payload too large","status":413,"code":"payload_too_large","instance":"$uri"}';
  }
  location @problem_429 {
    default_type application/problem+json;
    return 429 '{"type":"https://trustops.local/errors/rate_limited","title":"Too many requests","status":429,"code":"rate_limited","instance":"$uri"}';
  }
  location @problem_503 {
    default_type application/problem+json;
    return 503 '{"type":"https://trustops.local/errors/upstream_unavailable","title":"Service unavailable","status":503,"code":"upstream_unavailable","detail":"A dependency of the gateway is unavailable","instance":"$uri"}';
  }

  # Errors generated by the gateway itself (auth_request, limits, no
  # upstream). Upstream services' own problem+json bodies pass through
  # untouched because proxy_intercept_errors stays off.
  error_page 401 = @problem_401;
  error_page 403 = @problem_403;
  error_page 404 = @problem_404;
  error_page 413 = @problem_413;
  error_page 429 = @problem_429;
  error_page 500 502 503 504 = @problem_503;

  # ── never public: fcrm_service-only routes ───────────────────────────────
  location ~ ^/api/fcrm/(.+/)?internal(/|$) {
    return 404;
  }

  # ── X1 identity (login, refresh, logout, me, JWKS, validate) ─────────────
  location = /api/fcrm/auth/login {
    limit_req zone=fcrm_login burst=5 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$up_identity;
  }
  location /api/fcrm/auth/ {
    limit_req zone=fcrm_user burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$up_identity;
  }

  # ── S1 SSE streams: per case, per user, harness monitor ──────────────────
  location ~ ^/api/fcrm/(cases/[^/]+/stream|stream|monitor/[^/]+/stream)$ {
    # EventSource cannot send headers: accept ?access_token= here only. The
    # query string is never logged (log_format uses $uri). Prefer a
    # fetch-based EventSource that sends Authorization.
    set $fcrm_sse_auth $sse_authorization;
    auth_request /_auth;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Authorization $fcrm_sse_auth;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://$up_case;
  }

  # ── S1 uploads (≤ 50 MB per file, design A §2.1) ──────────────────────────
  location ~ ^/api/fcrm/cases/[^/]+/documents$ {
    client_max_body_size 60m;
    auth_request /_auth;
    limit_req zone=fcrm_user burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://$up_case;
  }

  # ── S1 one-item-per-call gate decisions (Rule 2: throttled at 5 r/s) ──────
  location ~ ^/api/fcrm/cases/[^/]+/items/[^/]+$ {
    auth_request /_auth;
    limit_req zone=fcrm_items burst=5 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$up_case;
  }

  # ── S1 everything else ────────────────────────────────────────────────────
  location ~ ^/api/fcrm/(cases|queue|conditions|reflags|dashboard|monitor)(/|$) {
    auth_request /_auth;
    limit_req zone=fcrm_user burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$up_case;
  }

  # ── S3 corpus upload ──────────────────────────────────────────────────────
  location = /api/fcrm/policy/corpus/sources {
    client_max_body_size 60m;
    auth_request /_auth;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_pass http://$up_policy;
  }

  # ── S2–S5 ─────────────────────────────────────────────────────────────────
  location /api/fcrm/scoring/ {
    auth_request /_auth;
    limit_req zone=fcrm_user burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$up_scoring;
  }
  location /api/fcrm/policy/ {
    auth_request /_auth;
    limit_req zone=fcrm_user burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$up_policy;
  }
  location /api/fcrm/audit/ {
    auth_request /_auth;
    limit_req zone=fcrm_user burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$up_audit;
  }
  location /api/fcrm/decision/ {
    auth_request /_auth;
    limit_req zone=fcrm_user burst=40 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$up_decision;
  }

  # ── unknown API paths never fall through to the SPA ──────────────────────
  location /api/ {
    return 404;
  }

  # ── W1 web (static build or vite dev server; see header) ──────────────────
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://$web_upstream;
  }
}
