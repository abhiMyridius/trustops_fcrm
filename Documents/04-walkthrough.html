<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrustOps Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a dark presentation stage. Centre: a browser window holding an exact
   replica of the TrustOps web app (its own light tokens, copied from
   src/frontend/src/design/tokens.css). Right: "Behind the screen", the harness
   monitor's view. Bottom: caption + chapter-grouped scrubber. The chrome commits
   to one dark look on purpose; the app inside keeps its real light theme. */
:root{
  color-scheme:dark;
  /* stage chrome */
  --st-bg:#08181b; --st-bg-2:#0c2226; --st-panel:#0f272b; --st-panel-2:#143236; --st-line:#22423f;
  --st-ink:#e8f0ee; --st-dim:#a3b8b5; --st-faint:#6f8a87;
  --st-leaf:#52e081; --st-beam:#e5fd84; --st-teal:#09a78d;
  /* callout tags, one per rubric theme */
  --tag-ai:#52e081; --tag-gate:#e5fd84; --tag-guard:#ffb46b; --tag-det:#86d4ff;
  --tag-ctx:#c8acff; --tag-eval:#ff9fcd; --tag-audit:#9fe6d2; --tag-harness:#5ee0c6;
  --f-display:'Montserrat','Segoe UI',system-ui,sans-serif;
  --f-ui:'Segoe UI',system-ui,-apple-system,sans-serif;
  --f-app:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif; /* the replica's own text, as in the app */
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  /* app replica tokens (values from the re-skinned TrustOps web app: linen page, carbon-moss dark surface, virtual-tide accent) */
  --moss:#194247; --moss-hover:#14363b; --moss-deep:#133338;
  --leaf:#52e081; --leaf-t1:#94dea5; --leaf-t2:#cbebbd; --leaf-t3:#e3f6db;
  --teal:#09a78d; --teal-hover:#088f79; --tide-tx:#06705f; --pavo:#337077; --carbon:#0c2226; --on-dark:#f6f3f0; --on-dark-mut:#b9c9c8; --danger-act:#c84b47;
  --surface:#ffffff; --surface-2:#ede9e4; --surface-3:#f6f3f0;
  --tx1:#194247; --tx2:#285055; --tx3:#4a6c70; --tx4:#9caaab;
  --bd:rgba(25,66,71,.10); --bd-strong:rgba(25,66,71,.16); --bd-subtle:rgba(25,66,71,.08); --bd-hair:rgba(25,66,71,.06);
  --ok:#09a78d; --ok-bg:#e2f4f1; --ok-tx:#06705f;
  --warn:#a67a14; --warn-bg:#f6f0e2; --warn-tx:#7f5d10;
  --bad:#8a3324; --bad-bg:#f9ece9;
  --info:#337077; --info-bg:#e6eeef;
  --ink2:#f6f3f0; --ink4:#e3e6e4; --ink10:#0c2226;
  --b1:#09a78d; --b1bg:#e2f4f1; --b1tx:#06705f;
  --b2:#337077; --b2bg:#e6eeef; --b2tx:#285c62;
  --b3:#a67a14; --b3bg:#f6f0e2; --b3tx:#7f5d10;
  --b4:#8a3324; --b4bg:#f9ece9; --b4tx:#8a3324;
  --sh-sm:0 1px 3px rgba(12,34,38,.04); --sh-md:0 4px 12px rgba(12,34,38,.08);
  --sh-lg:0 10px 24px rgba(12,34,38,.12); --sh-xl:0 20px 48px rgba(12,34,38,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{overflow:hidden}
body{margin:0;background:var(--st-bg);color:var(--st-ink);font-family:var(--f-ui);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--st-beam);outline-offset:2px}

/* ───────── stage shell ───────── */
.wt{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.wt-bar{display:flex;align-items:center;gap:12px;padding:5px 14px;border-bottom:1px solid var(--st-line);background:var(--st-bg-2)}
.wt-brand{display:flex;align-items:center;gap:10px;min-width:0}
.wt-brand .mk{width:22px;height:22px;border-radius:6px;background:var(--moss);display:grid;place-items:center;box-shadow:inset 0 0 0 1px #2a5a5f}
.wt-brand .mk i{width:8px;height:8px;border-radius:50%;background:var(--st-leaf);box-shadow:0 0 12px var(--st-leaf)}
.wt-brand b{font-family:var(--f-display);font-weight:800;font-size:13.5px;letter-spacing:.01em}
.wt-brand small{display:inline;margin-left:6px;color:var(--st-faint);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.wt-now{flex:1;min-width:0;display:flex;align-items:center;gap:10px;justify-content:center}
.wt-now{font-size:13px}
.wt-now .chip{font-family:var(--f-mono);font-size:10px;color:var(--st-bg);background:var(--st-leaf);padding:3px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.wt-now span{color:var(--st-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-now strong{font-family:var(--f-display);font-weight:700;color:var(--st-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-ctl{display:flex;align-items:center;gap:6px}
.cb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--st-line);background:var(--st-panel);color:var(--st-ink);cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}
.cb:hover{background:var(--st-panel-2);border-color:#2f5a56}
.cb svg{width:14px;height:14px}
.cb.play{background:var(--st-leaf);color:#06231a;border-color:var(--st-leaf);min-width:84px;justify-content:center}
.cb.play:hover{background:#6ae895}
.cb.icon{width:28px;padding:0;justify-content:center}
.cb[aria-pressed="false"]{color:var(--st-faint)}
.cb .kbd{font-family:var(--f-mono);font-size:10px;color:var(--st-faint);border:1px solid var(--st-line);border-radius:4px;padding:0 4px}

.wt-mid{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.wt-mid.solo{grid-template-columns:minmax(0,1fr) 0}
.vp{position:relative;min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,#123236 0%,var(--st-bg) 62%)}
.browser{position:absolute;left:50%;top:50%;width:1280px;height:798px;transform-origin:center center;border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);background:#fff}
.bw-top{height:34px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#e9edec;border-bottom:1px solid #d3dbd9}
.bw-dots{display:flex;gap:7px}
.bw-dots i{width:11px;height:11px;border-radius:50%;background:#cfd8d6}
.bw-dots i:nth-child(1){background:#ef8b7c}.bw-dots i:nth-child(2){background:#eec46a}.bw-dots i:nth-child(3){background:#7fcf8a}
.bw-url{flex:1;max-width:620px;margin:0 auto;height:24px;border-radius:8px;background:#fff;border:1px solid #d3dbd9;display:flex;align-items:center;gap:8px;padding:0 12px;color:#4a6c70;font-size:12.5px;font-family:var(--f-ui)}
.bw-url svg{width:13px;height:13px;color:#4a6c70;flex:none}
.bw-url .host{color:#9caaab}.bw-url .path{color:#0c2226;transition:opacity .25s}
.bw-url .path.chg{opacity:.2}
.bw-pad{width:60px}
.screen{position:relative;height:764px;overflow:hidden;background:var(--surface-3)}
#app,.xfade{position:absolute;inset:0}
.xfade{z-index:5;pointer-events:none;animation:ghostOut .5s ease forwards}
@keyframes ghostOut{to{opacity:0}}
#fx{position:absolute;inset:0;z-index:20;pointer-events:none}

/* ───────── behind the screen (harness monitor view) ───────── */
.under{min-width:0;min-height:0;display:flex;flex-direction:column;border-left:1px solid var(--st-line);background:var(--st-bg-2);overflow:hidden;transition:opacity .3s}
.wt-mid.solo .under{display:none}
.un-h{padding:10px 14px 8px;border-bottom:1px solid var(--st-line)}
.un-h .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.un-h b{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:13.5px;letter-spacing:.01em}
.un-h small{display:block;color:var(--st-faint);font-size:11.5px;margin-top:3px;line-height:1.4}
.fence{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#2b1b05;background:var(--tag-guard);padding:3px 7px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s}
.fence.on{opacity:1}
.un-ct{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 14px}
.un-ct div{background:var(--st-panel);border:1px solid var(--st-line);border-radius:10px;padding:8px 10px;min-width:0}
.un-ct small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--st-faint)}
.un-ct b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.un-ct em{display:block;font-style:normal;font-size:10.5px;color:var(--st-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.un-a{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 8px}
.ac{font-family:var(--f-mono);font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--st-line);color:var(--st-faint);transition:color .3s,border-color .3s,background .3s}
.ac.on{color:var(--st-leaf);border-color:#2a6b4b}
.ac.run{animation:acrun 1.4s ease}
@keyframes acrun{0%{background:#2e6b4f;color:#eafff1}100%{background:transparent}}
.un-a small{flex-basis:100%;font-size:10px;color:var(--st-faint);margin-top:1px}
.bump{animation:bump .9s ease}
@keyframes bump{0%{box-shadow:0 0 0 0 rgba(82,224,129,.7)}30%{box-shadow:0 0 0 4px rgba(82,224,129,.35)}100%{box-shadow:0 0 0 0 rgba(82,224,129,0)}}
.fly{position:fixed;z-index:70;pointer-events:none;font-family:var(--f-mono);font-size:11px;font-weight:600;color:#06231a;background:var(--st-beam);border-radius:7px;padding:3px 8px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);transform:translate(-50%,-120%);transition:transform 1.1s cubic-bezier(.4,.1,.2,1),opacity 1.1s ease-in;margin:-24px 0 0 -10px}
.fly.ai{background:var(--st-leaf)}
.fly.gd{background:var(--tag-guard)}
.un-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 14px 10px}
.gt{position:relative;border-radius:7px;background:var(--st-panel);border:1px solid var(--st-line);padding:6px 0 5px;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--st-faint);transition:background .3s,color .3s,border-color .3s}
.gt span{display:block;font-size:8.5px;letter-spacing:.02em;margin-top:1px;white-space:nowrap;overflow:hidden}
.gt.pass{color:var(--st-leaf);border-color:#2a6b4b}
.gt.block{color:var(--tag-guard);border-color:#7a5420;background:#2a2112}
.gt.flash{animation:gflash .8s ease}
@keyframes gflash{0%{background:#2e6b4f}100%{background:var(--st-panel)}}
.gt.block.flash{animation:bflash .8s ease}
@keyframes bflash{0%{background:#6b4a1a}100%{background:#2a2112}}
.un-log{flex:1;min-height:0;overflow:hidden;padding:4px 0 10px;border-top:1px solid var(--st-line);display:flex;flex-direction:column;justify-content:flex-end;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 36px);mask-image:linear-gradient(to bottom,transparent 0,#000 36px)}
.ln{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:6px 16px;font-size:12px;line-height:1.4;animation:lnIn .35s ease}
@keyframes lnIn{from{opacity:0;transform:translateY(6px)}}
.ln .w{font-family:var(--f-mono);font-size:10.5px;color:var(--st-leaf);padding-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .x{color:var(--st-ink);min-width:0}
.ln .x small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--st-faint);margin-top:1px}
.ln.warn .w,.ln.warn .x{color:var(--tag-guard)}
.ln.guard .w{color:var(--tag-guard)}
.ln.det .w{color:var(--tag-det)}
.ln.ai .w{color:var(--tag-ai)}
.ln.gate .w{color:var(--tag-gate)}
.ln.old{opacity:.45;animation:none}

/* ───────── caption + scrubber ───────── */
.wt-foot{border-top:1px solid var(--st-line);background:var(--st-bg-2);padding:6px 14px 7px;display:grid;gap:5px}
.cap{display:flex;gap:10px;align-items:flex-start;min-height:38px}
.cap .n{flex:none;font-family:var(--f-mono);font-size:10.5px;color:var(--st-faint);padding-top:2px;white-space:nowrap}
.cap p{margin:0;font-size:13.5px;line-height:1.42;color:var(--st-dim);max-width:130ch;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap p b{color:var(--st-ink);font-weight:650}
.tl{display:flex;gap:8px;align-items:flex-end;position:relative}
.tl-ch{flex:var(--w) 1 0;min-width:0;display:flex;flex-direction:column;gap:1px}
.tl-ch>small{font-size:9.5px;line-height:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--st-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl-ch.on>small{color:var(--st-leaf)}
.tl-segs{display:flex;gap:3px}
.seg{flex:var(--w) 1 0;height:12px;padding:3px 0;border:0;background:none;cursor:pointer;position:relative}
.seg i{display:block;height:6px;border-radius:3px;background:#24413f;overflow:hidden;position:relative}
.seg i b{position:absolute;inset:0 auto 0 0;width:0;background:var(--st-leaf);border-radius:3px}
.seg.done i b{width:100%;background:#2f8a62}
.seg:hover i{background:#33605c}
.tip{position:fixed;z-index:60;pointer-events:none;width:300px;background:var(--st-panel);border:1px solid #2f5a56;border-radius:12px;padding:8px;box-shadow:0 18px 48px rgba(0,0,0,.5);opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip .pv{width:284px;height:179px}
.tip .pv-t{display:block;font-size:12.5px;margin:8px 4px 2px}
.tip .pv-d{display:block;font-size:11.5px;color:var(--st-dim);margin:0 4px 2px;line-height:1.4}

/* preview: a live, scaled-down render of a scene's screen */
.pv{position:relative;overflow:hidden;border-radius:8px;background:var(--surface-3);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.pv>.pv-in{position:absolute;left:0;top:0;width:1280px;height:764px;transform-origin:0 0;pointer-events:none}
.pv>.pv-in>div{position:absolute;inset:0}

/* ───────── chapters drawer ───────── */
.dr{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:min(460px,100%) 1fr;visibility:hidden}
.dr.on{visibility:visible}
.dr-scrim{grid-column:1/3;grid-row:1;background:rgba(3,10,12,.55);opacity:0;transition:opacity .25s}
.dr.on .dr-scrim{opacity:1}
.dr-p{grid-column:1;grid-row:1;z-index:1;background:var(--st-bg-2);border-right:1px solid var(--st-line);display:flex;flex-direction:column;min-height:0;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.dr.on .dr-p{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 12px}
.dr-h h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:800}
.dr-h p{margin:3px 0 0;color:var(--st-faint);font-size:12.5px}
.dr-l{flex:1;overflow:auto;padding:4px 12px 20px}
.dr-c{margin:10px 0 4px}
.dr-c h3{display:flex;align-items:baseline;gap:10px;margin:0;padding:8px 8px 6px;font-family:var(--f-display);font-size:13px;font-weight:700}
.dr-c h3 i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--st-leaf)}
.dr-c h3 small{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--st-faint);font-weight:400}
.dr-c>p{margin:-2px 8px 6px 30px;font-size:12px;color:var(--st-faint);line-height:1.4}
.sc{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 8px;border:0;border-radius:9px;background:none;cursor:pointer}
.sc:hover,.sc:focus-visible{background:var(--st-panel)}
.sc.on{background:var(--st-panel-2)}
.sc .k{font-family:var(--f-mono);font-size:11px;color:var(--st-faint);text-align:right}
.sc.on .k{color:var(--st-leaf)}
.sc b{display:block;font-size:13.5px;font-weight:600;color:var(--st-ink)}
.sc small{display:block;font-size:11.5px;color:var(--st-faint);margin-top:1px}
.sc .who{font-size:10.5px;font-weight:700;color:var(--st-dim);border:1px solid var(--st-line);border-radius:999px;padding:2px 7px;white-space:nowrap}
.dr-pv{grid-column:2;grid-row:1;z-index:1;align-self:center;justify-self:start;margin-left:28px;width:min(520px,calc(100vw - 520px));opacity:0;transition:opacity .2s;pointer-events:none}
.dr-pv.on{opacity:1}
.dr-pv .pv{width:100%;aspect-ratio:1280/764;height:auto;max-width:100%}
.dr-pv .pv-t{display:block;margin-top:12px;font-family:var(--f-display);font-size:16px}
.dr-pv .pv-d{display:block;margin:4px 0 0;color:var(--st-dim);font-size:13px;line-height:1.5}

/* big play on first load */
.start{position:absolute;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
.start button{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:16px 26px 16px 20px;border-radius:999px;border:0;background:var(--st-leaf);color:#06231a;font-family:var(--f-display);font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 12px 40px rgba(82,224,129,.35)}
.start button svg{width:22px;height:22px}
.start button small{font-family:var(--f-ui);font-weight:600;font-size:12.5px;opacity:.75}

/* ───────── fx layer: cursor, callouts, spotlight, handover, toasts ───────── */
.wtc{position:absolute;left:0;top:0;width:24px;height:32px;z-index:40;transform:translate(1300px,400px);transition:transform .7s cubic-bezier(.3,.75,.25,1);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.wtc.instant{transition:none}
.wtc::after{content:"";position:absolute;left:-11px;top:-11px;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--teal);opacity:0}
.wtc.click::after{animation:rip .5s ease-out}
@keyframes rip{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.7)}}
.spot{position:absolute;z-index:15;border-radius:12px;box-shadow:0 0 0 3px var(--st-beam),0 0 0 4000px rgba(6,20,22,.34);transition:all .55s cubic-bezier(.3,.75,.25,1);opacity:0}
.spot.on{opacity:1}
.note{position:absolute;z-index:30;width:300px;background:#0c2226;color:#e8f0ee;border-radius:12px;padding:11px 13px 12px;box-shadow:0 14px 36px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.07);font-size:13px;line-height:1.45;animation:noteIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes noteIn{from{opacity:0;transform:translateY(6px) scale(.98)}}
.note.out{animation:noteOut .3s ease forwards}
@keyframes noteOut{to{opacity:0;transform:translateY(-4px)}}
.note .tg{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#0c2226;background:var(--c,var(--tag-ai));padding:2px 8px;border-radius:999px;margin-bottom:7px}
.note b{display:block;font-family:var(--f-display);font-weight:700;font-size:14px;margin-bottom:3px;color:#fff}
.note p{margin:0;color:#c3d4d1}
.note::before{content:"";position:absolute;width:12px;height:12px;background:#0c2226;transform:rotate(45deg)}
.note.right::before{left:-5px;top:18px}.note.left::before{right:-5px;top:18px}
.note.below::before{top:-5px;left:24px}.note.above::before{bottom:-5px;left:24px}
.note.free::before{display:none}
.hand{position:absolute;inset:0;z-index:35;display:grid;place-items:center;background:rgba(8,24,27,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .35s ease}
.hand.out{animation:fadeOut .4s ease forwards}
@keyframes fadeIn{from{opacity:0}} @keyframes fadeOut{to{opacity:0}}
.hand .hc{display:flex;align-items:center;gap:22px;background:#0c2226;color:#fff;border-radius:18px;padding:22px 30px;box-shadow:0 30px 70px rgba(0,0,0,.45);animation:handIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes handIn{from{transform:translateY(14px) scale(.97);opacity:0}}
.hand .av{width:54px;height:54px;font-size:17px}
.hand .arrow{color:var(--st-leaf);font-size:24px}
.hand .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--st-leaf)}
.hand h2{margin:4px 0 2px;font-family:var(--f-display);font-weight:800;font-size:24px}
.hand p{margin:0;color:#b5c8c5;font-size:14px;max-width:46ch}
.hand .fromto{display:flex;align-items:center;gap:10px}
.hand .fromto .av:first-child{opacity:.45;transform:scale(.85)}
.toast{position:absolute;right:22px;bottom:22px;z-index:25;width:380px;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh-lg);padding:12px 14px;display:flex;gap:10px;color:var(--tx1);animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}}
.toast svg{color:var(--ok);flex:none;margin-top:2px}
.toast b{display:block;font-size:13.5px}.toast small{display:block;color:var(--tx3);font-size:12.5px;margin-top:2px}

/* ───────── APP REPLICA ───────── */
.app{position:absolute;inset:0;display:grid;grid-template-columns:232px 1fr;font-family:var(--f-app);font-size:14px;line-height:1.5;color:var(--tx1);background:var(--surface-3)}
.app *{box-sizing:border-box}
[hidden]{display:none!important}
.ic{flex:none;vertical-align:middle}
.sb{background:var(--carbon);color:var(--on-dark);display:flex;flex-direction:column;min-height:0}
.sb-top{display:flex;align-items:center;justify-content:flex-end;padding:20px 20px 0}
.sb-top .chev{color:var(--on-dark-mut)}
.logo{display:flex;align-items:center;gap:5px;font-weight:700;font-size:10px;color:var(--moss)}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--moss);display:grid;place-items:center}
.logo i::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--leaf)}
.sb-name{padding:14px 20px 18px;border-bottom:1px solid rgba(82,224,129,.12)}
.sb-name b{display:block;font-size:21px;font-weight:800;color:var(--on-dark);letter-spacing:-.02em;line-height:1.2}
.sb-name small{display:block;font-size:10px;letter-spacing:.1em;font-weight:600;color:var(--leaf);margin-top:3px}
.sb-new{padding:16px 12px 4px}
.sb nav{padding:12px 0;display:flex;flex-direction:column;gap:2px}
.sb nav a{display:flex;align-items:center;gap:12px;padding:10px 20px;border-radius:0;color:var(--on-dark-mut);font-weight:500;font-size:14.5px;text-decoration:none}
.sb nav a .ic{color:inherit}
.sb nav a.on{background:rgba(82,224,129,.06);color:var(--on-dark);font-weight:650;box-shadow:inset 4px 0 0 var(--leaf)}
.sb-foot{margin-top:auto;border-top:1px solid rgba(82,224,129,.12);padding:16px 20px;font-size:11px;color:var(--on-dark-mut);line-height:1.5}
.col{display:grid;grid-template-rows:48px 1fr;min-width:0;min-height:0}
.tb{background:rgba(246,243,240,.85);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.acct{display:flex;align-items:center;gap:9px}
.acct b{display:block;font-size:13px;line-height:1.2}
.acct small{display:block;font-size:11.5px;color:var(--tx3);line-height:1.2}
.acct .ic{color:var(--tx2)}
.av{width:26px;height:26px;border-radius:50%;background:var(--leaf-t2);color:var(--moss);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.mn{overflow:hidden;position:relative;min-height:0}
.mn-in{padding:24px 32px 40px;max-width:1280px}
.mn-in > * + *{margin-top:20px}

.crumb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--tx2)}
.crumb b{color:var(--tx1);font-weight:600}
.crumb .ic{color:var(--tx4)}
.h1{margin:6px 0 2px;font-size:22px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--tx2)}
.hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.hd-r{display:flex;align-items:center;gap:10px;padding-top:26px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--tx2)}
.meta .clk{display:inline-flex;gap:5px;align-items:center}
.pinned{font-size:11px;color:var(--tx3);margin-top:12px}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace}

.bdg{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:12px;font-weight:600;padding:2px 8px;white-space:nowrap;line-height:1.5}
.bdg.neutral{background:var(--surface-2);color:var(--tx2)}
.bdg.plain{background:none;color:var(--tx2);padding:2px 4px}
.bdg.info{background:var(--info-bg);color:var(--moss)}
.bdg.ok{background:var(--ok-bg);color:var(--ok-tx)}
.bdg.warn{background:var(--warn-bg);color:var(--warn-tx)}
.bdg.bad{background:var(--bad-bg);color:var(--bad)}
.bdg.leaf{background:var(--leaf-t3);color:var(--moss)}
.bdg .ic{width:12px;height:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:.02em;padding:8px 18px;border:1.5px solid transparent;white-space:nowrap;cursor:default;line-height:1.4;transition:background .2s,color .2s,box-shadow .2s}
.btn.sm{font-size:12px;padding:5px 12px;border-radius:6px}
.btn.lg{font-size:15px;padding:12px 28px;border-radius:999px}
.btn.primary{background:var(--teal);color:#fff}
.btn.accent{background:var(--moss);color:var(--on-dark)}
.btn.secondary{background:transparent;border-color:currentColor;color:var(--moss)}
.btn.ghost{background:none;color:var(--tide-tx)}
.btn.danger{background:var(--danger-act);color:#fff}
.btn.w{width:100%}
.btn.dis{opacity:.45}
.btn.pressed{box-shadow:0 0 0 3px rgba(9,167,141,.25)}
.btn .ic{width:16px;height:16px}

.card{background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh-sm);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd-hair)}
.card-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-h p{margin:2px 0 0;font-size:11.5px;color:var(--tx3)}
.card-b{padding:18px 20px}
.card.dash{border-style:dashed;box-shadow:none}
.grid{display:grid;gap:20px;align-items:start}
.g-side{grid-template-columns:minmax(0,1fr) 320px}
.g-side-w{grid-template-columns:minmax(0,1fr) 360px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:20px}

.ban{display:flex;gap:12px;align-items:flex-start;border-radius:12px;border-left:4px solid;padding:12px 16px;font-size:13.5px;line-height:1.5}
.ban .ic{margin-top:2px}
.ban b{display:block;font-weight:650}
.ban.info{background:var(--info-bg);border-color:var(--pavo);color:var(--tx1)}
.ban.info .ic{color:var(--pavo)}
.ban.rule{background:var(--leaf-t3);border-color:var(--moss);color:var(--tx1)}
.ban.rule .ic{color:var(--moss)}
.ban.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--tx1)}
.ban.warn .ic{color:var(--warn)}
.ban.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--tx1)}
.ban.bad .ic,.ban.bad b{color:var(--bad)}
.ban.ok{background:var(--ok-bg);border-color:var(--teal);color:var(--tx1)}
.ban.ok .ic{color:var(--teal)}

.kpi{padding:20px}
.kpi small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);font-weight:600}
.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1.2;color:var(--teal)}
.kpi b em{font-style:normal;font-size:13px;font-weight:600;margin-left:4px}
.kpi p{margin:8px 0 0;font-size:12.5px;color:var(--tx2)}
.card.hot{border-color:var(--warn)}

.steps{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--bd);background:#fff;color:var(--tx2);white-space:nowrap}
.st.done{border-color:var(--teal);background:var(--ok-bg);color:var(--moss)}
.st.done .ic{width:12px;height:12px;color:var(--teal)}
.st.cur{background:var(--moss);border-color:var(--moss);color:#fff}
.steps .cn{width:12px;height:1px;background:var(--bd-strong)}
.steps.tight{gap:4px;flex-wrap:nowrap}
.steps.tight .st{padding:3px 8px;font-size:12px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd)}
.tab{position:relative;font-size:13.5px;font-weight:600;color:var(--tx2);padding:10px 12px 11px;display:inline-flex;align-items:center;gap:6px}
.tab.on{color:var(--moss)}
.tab.on::after{content:"";position:absolute;left:4px;right:4px;bottom:-1px;height:2px;border-radius:2px;background:var(--teal)}
.tab .cnt{min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:inline-grid;place-items:center;padding:0 4px}

table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
.tw{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff}
table.t th{background:var(--surface-3);color:var(--tx3);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd)}
table.t td{padding:11px 14px;border-bottom:1px solid var(--bd-hair);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right}
table.t tr.hl td{background:#fbf7ec}
table.t tr.hlb td{background:#fcf3f1}
table.t tr.hlo td{background:#f1faf7}
.cid{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:var(--tx2)}
.src{display:inline-flex;align-items:center;gap:4px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--moss);background:var(--surface-3);border:1px solid var(--bd);border-radius:6px;padding:1px 6px;white-space:nowrap}
.src .ic{width:11px;height:11px}
.muted{color:var(--tx3)}
.small{font-size:12.5px}
.xs{font-size:11.5px}

.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--ink4) 0);display:grid;place-items:center;flex:none;transition:--p .6s}
.ring::before{content:"";grid-area:1/1;width:76px;height:76px;border-radius:50%;background:#fff}
.ring b{grid-area:1/1;z-index:1;font-size:19px;font-weight:700}
.ringrow{display:flex;gap:18px;align-items:center}
.ringrow p{margin:0;font-size:13px;color:var(--tx2);line-height:1.6}
.ringrow p b{color:var(--tx1)}

.drop{border:2px dashed var(--bd-strong);border-radius:12px;background:var(--surface-3);padding:28px 20px;text-align:center}
.drop .ic{color:var(--pavo)}
.drop p{margin:8px 0 14px;font-weight:600;font-size:13.5px}
.file{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd-hair)}
.file:first-child{border-top:0}
.file .ic{color:var(--pavo)}
.file b{display:block;font-size:13.5px}
.file small{display:block;font-size:12px;color:var(--tx3)}
.file .gl{color:var(--ok-tx);font-size:12px;display:flex;gap:5px;align-items:center;margin-top:2px}
.bar{height:4px;border-radius:2px;background:var(--ink4);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s}
.asst{display:flex;gap:10px;font-size:13px;color:var(--tx2);line-height:1.5}
.asst .ic{display:none}

@keyframes spin{to{transform:rotate(360deg)}}

.trow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--bd-hair)}
.trow:first-child{border-top:0;padding-top:0}
.trow b{font-size:14px}
.trow .acts{display:flex;gap:6px;align-items:center}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-top:1px solid var(--bd-hair)}
.chk:first-of-type{border-top:0}
.box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--bd-strong);background:#fff;display:grid;place-items:center;flex:none;transition:all .15s}
.box.on{background:var(--moss);border-color:var(--moss);color:#fff}
.box.on::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk.dis{color:var(--tx4)}
.inp{border:1px solid var(--bd-strong);border-radius:12px;padding:8px 12px;font-size:13.5px;background:#fff;min-height:38px;color:var(--tx1);transition:box-shadow .2s,border-color .2s}
.inp.ta{min-height:64px;line-height:1.5}
.inp.focus{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),0 0 0 4px rgba(9,167,141,.15)}
.inp .ph{color:var(--tx4)}
.caret{display:inline-block;width:1.5px;height:1.05em;background:var(--tx1);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--moss);margin-bottom:6px}
.q{padding:14px 0;border-top:1px solid var(--bd-hair)}
.q:first-child{border-top:0;padding-top:0}
.q p{margin:0 0 8px;font-size:13.5px;font-weight:600}
.prov{display:inline-flex;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px}
.prov.ex{background:var(--info-bg);color:var(--moss)}
.prov.re{background:var(--leaf-t3);color:var(--moss)}
.prov.oa{background:var(--surface-2);color:var(--tx2)}
.prov.od{background:var(--warn-bg);color:var(--warn-tx)}
.prov.ao{background:var(--bad-bg);color:var(--bad)}

.scrim{position:absolute;inset:0;background:rgba(12,34,38,.45);z-index:10;display:grid;place-items:center;animation:fadeIn .25s ease}
.modal{width:620px;background:#fff;border-radius:20px;box-shadow:var(--sh-xl);overflow:hidden;animation:handIn .3s cubic-bezier(.2,.8,.2,1)}
.modal-h{padding:20px 24px 4px}
.modal-h h3{margin:0;font-size:17px}
.modal-h p{margin:4px 0 0;color:var(--tx2);font-size:13px}
.modal-b{padding:16px 24px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px 20px}
.cl{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:13.5px;border-top:1px solid var(--bd-hair)}
.cl:first-child{border-top:0}
.cl .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.cl.ok .dot{background:var(--ok-bg);color:var(--teal)}
.cl.pend{color:var(--tx3)}
.cl .dot .ic{width:13px;height:13px}

.score{border-left:4px solid var(--b2);background:var(--b2bg);border-radius:12px;padding:14px 18px;display:inline-block;min-width:260px;transition:background .5s,border-color .5s}
.score .v{font-size:30px;font-weight:700;color:var(--b2tx);line-height:1.1;font-variant-numeric:tabular-nums}
.score .bd{font-size:13.5px;font-weight:650;color:var(--b2tx);margin-left:8px}
.score .rt{margin-top:6px;font-size:13.5px;font-weight:600;color:var(--b2tx)}
.score .bf{margin-top:6px;font-size:12.5px;color:var(--warn-tx);display:flex;gap:6px;align-items:center}
.score.b3{border-color:var(--b3);background:var(--b3bg)}
.score.b3 .v,.score.b3 .bd,.score.b3 .rt{color:var(--b3tx)}
.score.b4{border-color:var(--b4);background:var(--b4bg)}
.score.b4 .v,.score.b4 .bd,.score.b4 .rt{color:var(--b4tx)}
.withheld{border:1.5px dashed var(--bd-strong);border-radius:12px;padding:20px;text-align:center;color:var(--tx2)}
.withheld b{display:block;font-size:15px;color:var(--tx1);margin:6px 0 4px}
.withheld p{margin:0;font-size:12.5px;line-height:1.5}
.withheld .why{margin-top:12px;font-size:12px;color:var(--tx3);border-top:1px solid var(--bd-hair);padding-top:10px}
.fac{background:var(--surface-3);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:28px;align-items:end}
.fac>.xs{grid-column:1/-1}
.fac small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);font-weight:600}
.fac b{font-size:14px}
.segs{display:flex;gap:3px;margin-top:6px}
.segs i{width:22px;height:5px;border-radius:3px;background:var(--bd-strong)}
.segs i.on{background:var(--moss)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{border:1px solid var(--bd);border-radius:10px;padding:9px 11px;background:#fff}
.tile small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.tile b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums;transition:color .3s}
.tile b.chg{color:var(--bad)}
.dec{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px}
.dec.ok{background:var(--ok-bg);color:var(--ok-tx)}
.dec.ov{background:var(--bad-bg);color:var(--bad)}
.dec .ic{width:12px;height:12px}
.clause{border:1px solid var(--bd);border-radius:12px;padding:14px 16px;background:#fff;transition:border-color .3s,background .3s}
.clause.acc{border-color:#9fd9cb;background:#fbfefd}
.clause .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.clause h4{margin:0;font-size:14px}
.clause .cr{font-size:11.5px;color:var(--tx3);margin-top:2px}
.clause blockquote{margin:10px 0 6px;padding:2px 0 2px 14px;border-left:3px solid var(--pavo);font-style:italic;color:var(--tx1);font-size:13.5px;display:flex;gap:8px}
.clause blockquote .ic{color:var(--pavo);flex:none;margin-top:3px;width:14px;height:14px}
.clause .vb{font-size:11.5px;color:var(--tx3)}
.clause .ca{display:flex;gap:8px;margin-top:10px}
.mx{display:grid;grid-template-columns:18px repeat(5,38px);grid-template-rows:repeat(5,38px) 18px;gap:3px;font-size:10.5px;color:var(--tx3)}
.mx i{border-radius:4px;display:block;position:relative}
.mx .ax{display:grid;place-items:center}
.mx .pt{position:absolute;inset:7px;border-radius:50%;border:2.5px solid var(--moss);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--moss);background:rgba(255,255,255,.75);font-style:normal}
.vote{border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff;min-height:132px;transition:border-color .3s}
.vote .vh{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px}
.vote .vh .av{width:30px;height:30px;font-size:11px}
.vote .vs{font-size:12.5px;color:var(--tx3);display:flex;gap:6px;align-items:center}
.vote .dots{letter-spacing:2px;color:var(--tx2)}
.vote blockquote{margin:0;font-size:12.5px;color:var(--tx2);font-style:italic;line-height:1.5}
.vote.rev{border-color:#9fd9cb;animation:flip .6s ease}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radio{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd-strong);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--tx2);transition:all .2s}
.radio i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bd-strong);display:block}
.radio.on{border-color:var(--moss);color:var(--moss);background:var(--leaf-t3)}
.radio.on i{border:4px solid var(--moss)}
.rec{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd-hair);font-size:13px}
.rec:first-child{border-top:0}
.rchip{display:inline-flex;align-items:center;gap:4px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;background:var(--info-bg);color:var(--moss);border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.rchip .ic{width:11px;height:11px}
.rec small{display:block;color:var(--tx3);font-size:11.5px}
.ans li{margin:0 0 10px;font-size:13.5px;line-height:1.55;animation:lnIn .4s ease}
.ans{margin:0;padding-left:20px}
.hb{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.hb span{color:var(--tx2);text-align:right}
.hb i{display:block;height:16px;border-radius:3px;background:var(--teal);width:0;transition:width .7s cubic-bezier(.3,.75,.25,1)}
.hb i.low{background:var(--bad)}
.hb b{font-variant-numeric:tabular-nums;font-size:12px}
.sec{padding:16px 20px;border-top:1px solid var(--bd-hair)}
.sec h4{margin:0 0 8px;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.sec h4 .fz{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--tx3);font-weight:600}
.sec h4 .fz .ic{width:12px;height:12px}
.sec h4 i{font-style:normal;font-family:ui-monospace,Menlo,monospace;color:var(--tx3);font-weight:500;margin-right:6px}
.thread{border:1px solid var(--bd);border-radius:12px;padding:14px 16px;background:#fff}
.thread + .thread{margin-top:12px}
.msg{display:flex;gap:10px;margin-top:10px;font-size:13.5px;line-height:1.5}
.msg:first-child{margin-top:0}
.msg .av{width:28px;height:28px}
.msg small{display:block;color:var(--tx3);font-size:11.5px}

/* monitor page (standalone layout) */
.mon-app{position:absolute;inset:0;background:var(--ink2);display:grid;grid-template-rows:42px 1fr;font-family:var(--f-app);color:var(--tx1);font-size:14px;line-height:1.5}
.mon-top{background:rgba(246,243,240,.85);backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--bd);color:var(--tx1);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px}
.mon-top b{font-weight:800;letter-spacing:-.02em}.mon-top span{color:var(--tx3)}
.mon-in{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.mon-hd{background:linear-gradient(135deg,rgba(82,224,129,.06),transparent 70%),var(--carbon);border:1px solid rgba(82,224,129,.12);color:#fff;border-radius:20px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.mon-hd b{font-size:16px}.mon-hd small{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#c7d5d5;margin-top:2px}
.mon-hd .pills{display:flex;gap:8px;align-items:center}
.pill-run{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--tx1);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.pill-run i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.2s ease infinite}
.pill-run.wait i{background:var(--warn);animation:none}
@keyframes pulse{50%{opacity:.35}}
.pill-s{background:var(--info-bg);color:var(--moss);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.mon-ct{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mon-ct .card{padding:14px 16px}
.mon-ct small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);font-weight:600}
.mon-ct b{display:block;font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.mon-ct p{margin:2px 0 0;font-size:12px;color:var(--tx2)}
.mon-g{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.mg{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:9px 11px;transition:border-color .3s,background .3s}
.mg b{display:block;font-size:12px}
.mg small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--tx3);margin:2px 0}
.mg p{margin:0;font-size:11px;color:var(--tx2);line-height:1.35}
.mg.pass{border-color:#9fd9cb}.mg.pass small{color:var(--teal)}
.mg.block{border-color:#e2c27a;background:#fffbf1}.mg.block small{color:var(--warn-tx)}
.term{background:var(--ink10);border-radius:10px;padding:8px 14px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#e8f0ee;height:252px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.tl2{display:grid;grid-template-columns:44px 150px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid #1c3a3d;animation:lnIn .3s ease}
.tl2 .w{color:var(--leaf)}.tl2 .tm{color:#7d9693}
.tl2 small{display:block;color:#7d9693;font-size:11px}
.tl2.warn .x,.tl2.warn .w{color:#e5fd84}

/* slides inside the frame */
.slide{position:absolute;inset:0;background:var(--moss);color:#fff;overflow:hidden;font-family:var(--f-app)}
.slide::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 85% 10%,rgba(82,224,129,.18),transparent 60%),radial-gradient(ellipse 60% 70% at 0% 100%,rgba(9,167,141,.22),transparent 60%)}
.slide>*{position:relative}
.sl-in{padding:48px 56px;height:100%;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--leaf)}
.sl-t{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sl-lead{font-size:17px;line-height:1.55;color:#c7d5d5;max-width:68ch;margin:0}
.rv{transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.pre .rv{opacity:0;transform:translateY(14px)}
.pre .rv.in{opacity:1;transform:none}
.casecard{background:#fff;color:var(--tx1);border-radius:18px;padding:22px 24px;display:grid;grid-template-columns:1.25fr 1fr;gap:26px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.casecard .id{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;color:var(--tx3)}
.casecard h3{margin:4px 0 8px;font-size:22px;line-height:1.25}
.casecard p{margin:0;font-size:13.5px;color:var(--tx2);line-height:1.55}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;align-content:start}
.facts small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.facts b{font-size:14px}
.cast{display:flex;gap:14px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 14px 9px 10px}
.person .av{width:36px;height:36px;font-size:12px}
.person b{display:block;font-size:14px}.person small{display:block;font-size:12px;color:#a9c0bd}
.journey{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.jstep{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px}
.jstep i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--leaf)}
.jstep b{display:block;font-size:14px;margin:3px 0 2px}
.jstep small{display:block;font-size:12px;color:#a9c0bd;line-height:1.45}
.rules{display:flex;gap:10px;flex-wrap:wrap}
.rules span{font-size:12.5px;font-weight:600;color:var(--moss-deep);background:var(--leaf-t2);border-radius:999px;padding:5px 12px}
.foot-note{margin-top:auto;font-size:12px;color:#93aeab}
/* architecture slide */
.arch{display:grid;grid-template-columns:150px 1fr 230px;gap:16px;align-items:stretch}
.ab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;transition:background .4s,border-color .4s,box-shadow .4s}
.ab b{display:block;font-size:14px}
.ab small{display:block;font-size:11.5px;color:#a9c0bd;line-height:1.4;margin-top:2px}
.ab.lit{background:rgba(82,224,129,.16);border-color:var(--leaf);box-shadow:0 0 0 3px rgba(82,224,129,.18)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{font-size:11.5px;font-weight:600;border-radius:8px;padding:4px 8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:all .4s}
.chips span.lit{background:var(--leaf);color:var(--moss-deep);border-color:var(--leaf)}
.flow-col{display:flex;flex-direction:column;gap:12px}
.bus{text-align:center;border-style:dashed}
.gpipe{display:flex;gap:6px;align-items:stretch}
.gpipe div{flex:1;border-radius:10px;padding:8px 8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:11.5px;line-height:1.3;transition:all .4s}
.gpipe div b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--leaf)}
.gpipe div.model{background:rgba(229,253,132,.12);border-color:#b8c96a;flex:.8;text-align:center}
.gpipe div.model b{color:var(--st-beam)}
.gpipe div.lit{background:rgba(82,224,129,.2);border-color:var(--leaf)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tiers div{font-size:11.5px;color:#c7d5d5;line-height:1.4;background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px}
.tiers b{display:block;color:#fff;font-size:12px}
.rub{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rc{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.rc .w{display:flex;justify-content:space-between;align-items:baseline}
.rc .w i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--leaf);font-weight:600}
.rc .w b{font-size:14px}
.rc ul{margin:0;padding-left:16px;font-size:12px;color:#c7d5d5;line-height:1.45}
.rc ul li+li{margin-top:3px}
.rc ul li b{color:#fff;font-weight:650}
.honest{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;font-size:12.5px;color:#c7d5d5;line-height:1.5}
.honest b{color:var(--st-beam)}

/* slide scenes, clean mode */
.browser.slide-mode .bw-url .host,.browser.slide-mode .bw-url svg{display:none}
.browser.slide-mode .bw-url{justify-content:center}
.browser.slide-mode .bw-url .path{color:#4a6c70}
#fx.clean .note,#fx.clean .spot,#fx.clean .wtc{display:none}
.hand .av.sys{background:var(--moss);color:var(--leaf);border:2px solid var(--leaf)}

/* responsive stage */
@media (max-width:1100px){
  .wt-mid{grid-template-columns:minmax(0,1fr) 260px}
  .wt-now span{display:none}
}
@media (max-width:860px){
  .wt-mid,.wt-mid.solo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 190px}
  .wt-mid.solo{grid-template-rows:minmax(0,1fr) 0}
  .under{border-left:0;border-top:1px solid var(--st-line)}
  .un-g{display:none}
  .wt-now{display:none}
  .tl-ch>small{display:none}
  .cb .lbl,.cb .kbd{display:none}
  .wt-bar{padding:8px 16px}
  .wt-foot{padding:8px 16px 10px}
  .cap p{font-size:13px}
  .dr-pv{display:none}
}
@media (max-width:560px){
  .wt-brand>div,#bNotes,#bUnder,#bSpeed{display:none}
  .wt-ctl{gap:4px;margin-left:auto}
  .un-ct{padding:10px 16px}
}

/* ════════════════════════════ ENGINE ════════════════════════════
   Each scene runs on its own clock (scene time, ms). Steps are [t, fn] pairs
   fired once when the clock passes t; tweens are driven by the same clock, so
   pause, speed and seeking never replay or skip anything. Seeking re-renders
   the scene's start state and fast-forwards its steps. */

var SC=[], CH=[];

function seq(){var out=[];(function add(a){if(typeof a[0]==='number'&&typeof a[1]==='function'){out.push(a);return;}a.forEach(add);})(Array.prototype.slice.call(arguments));
  out.sort(function(a,b){return a[0]-b[0];});return out;}
function scene(def){def.steps=def.steps||[];def.dur=def.dur||10000;SC.push(def);}
function chapter(def){CH.push(def);}

    var g=APP.cloneNode(true);g.removeAttribute('id');g.className='xfade';
    Array.prototype.forEach.call(g.querySelectorAll('[id]'),function(n){n.removeAttribute('id');});
    var gm=g.querySelector('.mn'),am=q('.mn');if(gm&&am)gm.scrollTop=am.scrollTop;
    SCREEN.insertBefore(g,FX);setTimeout(function(){g.remove();},560);
  }

}

function setUrl(p){var u=$('url');if(u.textContent===p)return;if(E.ff){u.textContent=p;return;}u.classList.add('chg');setTimeout(function(){u.textContent=p;u.classList.remove('chg');},180);}

function rel(el){var s=SCREEN.getBoundingClientRect(),r=el.getBoundingClientRect(),k=s.width/1280||1;return {x:(r.left-s.left)/k,y:(r.top-s.top)/k,w:r.width/k,h:r.height/k};}

var curPos={x:1300,y:420};

function moveTo(sel,dx,dy){var el=typeof sel==='string'?q(sel):sel;if(!el)return;var r=rel(el);
  CUR.classList.toggle('instant',E.ff);CUR.style.transitionDuration=(0.7/E.speed)+'s';
  placeCur(r.x+Math.min(r.w*0.5,Math.max(10,r.w-18))+(dx||0),r.y+r.h*0.55+(dy||0));}

/* ── clock-driven tweens ── */
function tween(d,fn){var tw={s:E.stepT,d:Math.max(1,d),fn:fn};E.tweens.push(tw);runTween(tw);}
function runTween(tw){var p=(E.t-tw.s)/tw.d;if(p<0)return false;tw.fn(Math.min(1,p));return p>=1;}
function runTweens(){E.tweens=E.tweens.filter(function(tw){return !runTween(tw);});}
function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;}
function type(sel,text,d,done){var el=q(sel);if(!el)return;d=d||Math.min(2400,Math.max(700,text.length*32));
  el.classList.add('focus');var last=-1;
  tween(d,function(p){var n=Math.round(text.length*p);if(n===last)return;last=n;var e2=q(sel)||el;
    e2.innerHTML=esc(text.slice(0,n))+(p<1?'<span class="caret"></span>':'');if(p>=1){e2.classList.remove('focus');if(done)done();}});}
function tabsTop(off){var m=q('.mn'),el=q('.tabs');if(!m||!el)return;m.scrollTop=Math.max(0,m.scrollTop+(el.getBoundingClientRect().top-m.getBoundingClientRect().top)/scaleK()-(off==null?8:off));}

var TIP=$('tip');
function showTip(k,el){var pv=TIP.querySelector('.pv');pv.style.height=Math.round(284*764/1280)+'px';fillPreview(pv,k);
  TIP.querySelector('.pv-t').textContent=(k+1)+' · '+SC[k].title;TIP.querySelector('.pv-d').textContent=SC[k].sum;
  var r=el.getBoundingClientRect();TIP.classList.add('on');var h=TIP.offsetHeight;
  TIP.style.left=Math.max(8,Math.min(window.innerWidth-308,r.left+r.width/2-150))+'px';TIP.style.top=Math.max(8,r.top-h-10)+'px';}
function hideTip(){TIP.classList.remove('on');}

/* chapters drawer */
var DR=$('dr'),DRL=$('drL'),DRPV=$('drPv');
$('drSub').textContent=SC.length+' scenes in '+CH.length+' chapters · about '+Math.round(TOTAL/60000)+' minutes at 1×';
DRL.innerHTML=CH.map(function(c,i){return '<div class="dr-c"><h3><i>0'+(i+1)+'</i>'+c.t+'<small>'+mmss(c.dur)+'</small></h3><p>'+c.d+'</p>'+
  c.scenes.map(function(k){return '<button type="button" class="sc" data-k="'+k+'"><span class="k">'+(k+1)+'</span><span><b>'+SC[k].title+'</b><small>'+SC[k].sum+'</small></span><span class="who">'+(SC[k].who==='—'?'Slide':SC[k].who)+'</span></button>';}).join('')+'</div>';}).join('');
Array.prototype.forEach.call(DRL.querySelectorAll('.sc'),function(b){var k=+b.getAttribute('data-k');
  var show=function(){fillPreview(DRPV.querySelector('.pv'),k);DRPV.querySelector('.pv-t').textContent=(k+1)+' · '+SC[k].title;DRPV.querySelector('.pv-d').textContent=SC[k].sum;DRPV.classList.add('on');};
  b.addEventListener('mouseenter',show);b.addEventListener('focus',show);
  b.addEventListener('click',function(){closeDrawer();navigate(k);});});
function openDrawer(){DR.classList.add('on');Array.prototype.forEach.call(DRL.querySelectorAll('.sc'),function(b){b.classList.toggle('on',+b.getAttribute('data-k')===E.k);});
  var cur=DRL.querySelector('.sc.on');if(cur){cur.scrollIntoView({block:'center'});setTimeout(function(){cur.focus();},50);}}
function closeDrawer(){DR.classList.remove('on');DRPV.classList.remove('on');$('bChap').focus();}
$('bChap').addEventListener('click',function(){DR.classList.contains('on')?closeDrawer():openDrawer();});
$('drX').addEventListener('click',closeDrawer);$('drScrim').addEventListener('click',closeDrawer);

/* scene control */
function enter(){if(E.entered)return;E.entered=true;if(E.sc.enter)E.sc.enter(E.S);}
function go(k,o){o=o||{};k=Math.max(0,Math.min(SC.length-1,k));var first=!E.sc;
  E.k=k;E.sc=SC[k];E.t=0;E.stepT=0;E.fired=0;E.tweens=[];E.entered=false;
  clearFx();hideTip();closeModalAny();
  panelAt(E.sc.rec0,E.sc.agentsExtra);
  E.S=E.sc.init?E.sc.init():{};E.S.live=true;if(E.S.recs==null)E.S.recs=E.sc.rec0;
  render(E.sc.view(E.S),!first&&!o.instant);counters();
  BROWSER.classList.toggle('slide-mode',!!E.sc.slide);if(E.sc.slide){CUR.classList.add('instant');placeCur(1300,700);requestAnimationFrame(function(){CUR.classList.remove('instant');});}
  setUrl(E.sc.url);cap(E.sc.cap);
  $('nowCh').textContent='Chapter '+(E.sc.ch+1);$('nowT').textContent=E.sc.title;$('nowP').textContent='· '+CH[E.sc.ch].t;
  $('capN').textContent=(k+1)+' / '+SC.length;$('fence').classList.toggle('on',!!E.sc.fence);
  Array.prototype.forEach.call(TL.querySelectorAll('.tl-ch'),function(d,i){d.classList.toggle('on',i===E.sc.ch);});
  SEGS.forEach(function(b,i){if(i===k)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
  E.steps=E.sc.steps;progressUI();
  try{history.replaceState(null,'','#scene-'+(k+1));}catch(e){}
  if(E.playing)enter();
}
function closeModalAny(){}
function seek(T){go(E.k,{instant:true});E.ff=true;CUR.classList.add('instant');enter();advance(Math.max(0,Math.min(T,E.sc.dur-1)),true);E.ff=false;
  requestAnimationFrame(function(){CUR.classList.remove('instant');});}
function advance(T,noAuto){var st=E.steps;
  while(E.fired<st.length&&st[E.fired][0]<=T){var s=st[E.fired++];E.stepT=s[0];E.t=s[0];runTweens();try{s[1](E.S);}catch(err){if(window.console)console.error('scene '+(E.k+1)+' step @'+s[0],err);}runTweens();}
  E.t=T;E.stepT=T;runTweens();progressUI();
  if(!noAuto&&E.playing&&T>=E.sc.dur){if(E.k<SC.length-1)go(E.k+1);else{E.playing=false;playUI();cap('<b>The end.</b> Press Play to watch again, or open <b>Chapters</b> to jump to any scene.');}}
}
function frame(ts){var dt=E.last?Math.min(ts-E.last,80):0;E.last=ts;if(E.playing&&E.sc)advance(E.t+dt*E.speed);requestAnimationFrame(frame);}

/* controls */
function playUI(){var end=!E.playing&&E.k===SC.length-1&&E.t>=E.sc.dur-1;
  $('bPlayT').textContent=E.playing?'Pause':end?'Replay':'Play';
  $('bPlay').querySelector('svg').innerHTML=E.playing?'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';}
function hideStart(){var s=$('start');if(s)s.hidden=true;}
function togglePlay(){hideStart();
  if(!E.playing&&E.k===SC.length-1&&E.t>=E.sc.dur-1){E.playing=true;go(0);playUI();return;}
  E.playing=!E.playing;if(E.playing)enter();playUI();}
function navigate(k){hideStart();E.playing=true;go(k);playUI();}
$('bPlay').addEventListener('click',togglePlay);
$('bStart').addEventListener('click',togglePlay);
$('bPrev').addEventListener('click',function(){navigate(E.t>2500?E.k:E.k-1);});
$('bNext').addEventListener('click',function(){if(E.k<SC.length-1)navigate(E.k+1);});
$('bSpeed').addEventListener('click',function(){E.speed=E.speed===1?1.5:E.speed===1.5?2:1;this.textContent=E.speed+'×';});
function toggleNotes(){E.notesOn=!E.notesOn;FX.classList.toggle('clean',!E.notesOn);$('bNotes').setAttribute('aria-pressed',String(E.notesOn));if(!E.notesOn){unnote();unspot();}}
function toggleUnder(){var on=$('mid').classList.toggle('solo');$('bUnder').setAttribute('aria-pressed',String(!on));fit();}
$('bNotes').addEventListener('click',toggleNotes);$('bUnder').addEventListener('click',toggleUnder);
document.addEventListener('keydown',function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(DR.classList.contains('on')){if(e.key==='Escape'){e.preventDefault();closeDrawer();}return;}
  var k=e.key;
  if(k===' '){e.preventDefault();togglePlay();}
  else if(k==='ArrowRight'){e.preventDefault();$('bNext').click();}
  else if(k==='ArrowLeft'){e.preventDefault();$('bPrev').click();}
  else if(k==='c'||k==='C'){openDrawer();}
  else if(k==='a'||k==='A'){toggleNotes();}
  else if(k==='b'||k==='B'){toggleUnder();}
  else if(k==='Home'){navigate(0);}
  else if(/^[1-7]$/.test(k)){navigate(CH[+k-1].scenes[0]);}
});

/* fit the 1280×808 browser into the stage */
function fit(){var r=VP.getBoundingClientRect();var k=Math.min((r.width-20)/1280,(r.height-14)/798);BROWSER.style.transform='translate(-50%,-50%) scale('+Math.max(.12,k)+')';}
if(window.ResizeObserver)new ResizeObserver(fit).observe(VP);window.addEventListener('resize',fit);fit();

/* boot */
$('startDur').textContent='· '+Math.round(TOTAL/60000)+' min';
var m=/scene-(\d+)/.exec(location.hash||''),k0=m?Math.max(0,Math.min(SC.length-1,+m[1]-1)):0;
go(k0,{instant:true});playUI();
if(k0>0)$('startDur').textContent='· from scene '+(k0+1);
requestAnimationFrame(frame);
window.TRUSTOPS_WT={go:navigate,seek:function(t){seek(t);},scenes:SC.length,state:E};
})();
</script>
</body>
</html>
