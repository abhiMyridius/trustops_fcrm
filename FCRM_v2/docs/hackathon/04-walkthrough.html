<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Risk Assessment Workbench · Guided walkthrough</title></head><body>
<title>Workbench Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control bar · mocked enterprise workbench (sidebar, topbar, content, docked backend monitor) with an animated cursor · caption · scene timeline. Fixed light theme. */
:root{color-scheme:light;
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#E6EBE9; --surface-3:#F6F8F7;
  --ink:#0C2226; --ink-2:#2B5358; --ink-3:#5C7F84; --border:#D3DDDB;
  --moss:#194247; --accent:#09A78D; --accent-soft:#DDF3EE; --leaf:#CBEBBD;
  --warn:#8a6512; --warn-bg:#FBF1D9; --bad:#9a3524; --bad-bg:#F7E3DE; --ok:#1f7a45; --ok-bg:#E1F4E6;
  --mon:#0F262A; --mon-2:#163338; --mon-ink:#DDE7E5; --mon-dim:#8FB0B3;
  --fs:clamp(12px,1.05vw,15.5px); --fs-s:clamp(11px,.92vw,13.5px); --fs-xs:clamp(10px,.8vw,12px);
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.4;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:.8vh;padding:1vh 1.2vw}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-family:var(--f-display);font-size:clamp(18px,1.8vw,26px);margin:0;color:var(--moss);font-weight:700}
.bar h1 span{color:var(--accent)}
.bar .sp{flex:1}
.bar button{font:500 var(--fs-s) var(--f-body);padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer}
.bar button.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:84px}
.bar button:disabled{opacity:.45;cursor:default}
.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar .cnt{font-family:var(--f-mono);font-size:var(--fs-s);color:var(--ink-3)}
/* frame */
.frame{position:relative;display:grid;grid-template-columns:clamp(130px,12vw,190px) 1fr clamp(260px,25vw,380px);grid-template-rows:auto 1fr;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-height:0}
.side{grid-row:1/3;background:var(--surface-3);border-right:1px solid var(--border);padding:1.4vh 1vw;display:flex;flex-direction:column;gap:.6vh}
.side .brand{font-family:var(--f-display);font-weight:700;font-size:clamp(15px,1.35vw,20px);color:var(--moss)}
.side .brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:var(--fs-xs);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.side .newcase{margin-top:1vh;background:var(--moss);color:#fff;border-radius:6px;padding:.8vh .8vw;font-weight:600;text-align:center;font-size:var(--fs-s)}
.side .nav{margin-top:.8vh;display:flex;flex-direction:column;gap:3px}
.side .nav div{padding:.75vh .7vw;border-radius:6px;color:var(--ink-2);font-size:var(--fs-s)}
.side .nav div.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.side .who{margin-top:auto;padding:.8vh .7vw;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:var(--fs-s)}
.side .who b{display:block}.side .who small{color:var(--ink-3);font-size:var(--fs-xs)}
.top{grid-column:2/4;display:flex;align-items:center;gap:12px;padding:1vh 1.1vw;border-bottom:1px solid var(--border)}
.top .crumb{color:var(--ink-3);font-size:var(--fs-s)}
.top .title{font-weight:600}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.ac{background:var(--accent-soft);color:var(--accent)}
.main{padding:1.1vh 1.1vw;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.9vh}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);font-size:var(--fs-s);flex-wrap:wrap}
.tabs span{padding:.5vh .8vw;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs span.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.grid{display:grid;gap:.8vw;min-height:0}
.g2{grid-template-columns:1fr 1fr}.g31{grid-template-columns:1.4fr 1fr}.g13{grid-template-columns:1fr 1.5fr}.g3{grid-template-columns:repeat(3,1fr)}
.box{background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:1vh 1vw;min-height:0;overflow:hidden}
.box h4{margin:0 0 .6vh;font-size:var(--fs-s);font-weight:600;color:var(--ink-2)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vw}
.kpi .box b{display:block;font-family:var(--f-display);font-size:clamp(22px,2.2vw,34px);line-height:1;color:var(--moss)}
.kpi .box small{color:var(--ink-3);font-size:var(--fs-xs)}
table.t{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.t th{text-align:left;color:var(--ink-3);font-weight:600;padding:.4vh .5vw;border-bottom:1px solid var(--border);font-size:var(--fs-xs)}
.t td{padding:.55vh .5vw;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t td.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.t tr.hl td{background:var(--warn-bg)}.t tr.hlok td{background:var(--ok-bg)}.t tr.hlac td{background:var(--accent-soft)}
.src{font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:4px;white-space:nowrap}
.src.from{color:var(--ink-2);background:var(--surface-2)}
.btn{display:inline-block;padding:4px 11px;border-radius:5px;font-size:var(--fs-xs);font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn.p{background:var(--moss);border-color:var(--moss);color:#fff}
.btn.a{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.d{border-color:var(--bad);color:var(--bad)}
.btn.done{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.ring{width:clamp(64px,6.5vw,96px);height:clamp(64px,6.5vw,96px);border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;position:relative;transition:--p .8s}
.ring::after{content:attr(data-v);position:absolute;inset:14%;background:var(--surface-3);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:clamp(14px,1.3vw,20px);color:var(--moss)}
.score{display:flex;gap:1.2vw;align-items:center}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,2.8vw,44px);line-height:1;color:var(--moss);font-variant-numeric:tabular-nums}
.arrow{color:var(--ink-3);font-size:clamp(16px,1.5vw,22px)}
.band{display:inline-block;padding:2px 9px;border-radius:5px;font-weight:700;font-family:var(--f-display);font-size:var(--fs-s)}
.b2{background:var(--leaf);color:#1f5a33}.b3{background:var(--warn-bg);color:var(--warn)}
.upload{border:1.5px dashed var(--border);border-radius:8px;padding:1.2vh 1vw;display:flex;flex-direction:column;gap:.7vh;min-height:14vh}
.doc{display:flex;gap:8px;align-items:center;font-size:var(--fs-s)}
.doc i{width:12px;height:15px;border:1.5px solid var(--ink-3);border-radius:2px;display:inline-block;flex:none}
.doc .p{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.doc .p b{display:block;height:100%;width:0;background:var(--accent);transition:width 1.4s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.1vh 1vw;box-shadow:0 10px 28px rgba(12,34,38,.14)}
.modal h4{margin:0 0 .5vh;font-size:var(--fs);color:var(--ink)}
label.l{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-top:.6vh}
.field{border:1px solid var(--border);border-radius:5px;padding:.55vh .6vw;background:var(--surface);font-size:var(--fs-s);min-height:3vh}
.field.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.field .caret{display:inline-block;width:1px;height:1em;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.banner{border-radius:8px;padding:.9vh 1vw;font-size:var(--fs-s);border-left:3px solid}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}.banner.ok{background:var(--ok-bg);border-color:var(--ok)}.banner.ac{background:var(--accent-soft);border-color:var(--accent)}.banner.bad{background:var(--bad-bg);border-color:var(--bad)}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:.7vw}
.vote{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.8vh .7vw;text-align:center;font-size:var(--fs-s)}
.vote b{display:block}.vote .st{margin-top:.5vh;font-family:var(--f-display);font-weight:700}
.lock{font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--ink-3)}
.qa{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.9vh 1vw;font-size:var(--fs-s)}
.qa .q{font-weight:600}.qa .a{margin-top:.6vh;color:var(--ink-2)}
.qa .refs{margin-top:.6vh;display:flex;gap:6px;flex-wrap:wrap}
.ref{font-family:var(--f-mono);font-size:var(--fs-xs);padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.check{display:flex;gap:8px;align-items:center;padding:.4vh 0;font-size:var(--fs-s)}
.check i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);display:inline-grid;place-items:center;font-size:10px;color:#fff;flex:none}
.check.ok i{background:var(--ok);border-color:var(--ok)}
.check.ok i::after{content:"✓"}
.cb{width:14px;height:14px;border:1.5px solid var(--ink-3);border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:6px}
.cb.on{background:var(--accent);border-color:var(--accent);position:relative}
.cb.on::after{content:"✓";color:#fff;font-size:10px;position:absolute;left:2px;top:-2px}
.login{margin:auto;width:min(420px,90%);text-align:center;padding:3vh 2vw}
.login .brand{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,2.4vw,36px);color:var(--moss)}
.login .brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.login .btn{display:block;margin:2vh auto 0;padding:1vh 1.4vw;font-size:var(--fs)}
.aicard{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:.8vh 1vw;font-size:var(--fs-s);display:flex;gap:10px;align-items:flex-start}
.aicard .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(9,167,141,.25)}50%{box-shadow:0 0 0 7px rgba(9,167,141,.12)}}
.aicard.still .dot{animation:none}
.hidden{display:none!important}
.fade{animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* backend monitor */
.mon{border-left:1px solid var(--border);background:var(--mon);color:var(--mon-ink);display:flex;flex-direction:column;min-height:0;font-size:var(--fs-s)}
.mon .mhd{padding:.9vh 1vw;border-bottom:1px solid var(--mon-2);display:flex;flex-direction:column;gap:3px}
.mon .mhd .row{display:flex;align-items:center;gap:8px}
.mon .mhd b{font-weight:600}
.mon .mhd .dot{width:8px;height:8px;border-radius:50%;background:#3ED2B4}
.mon .mhd .dot.run{animation:pulse 1.2s infinite}
.mon .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--mon-dim)}
.mon .st span b{color:var(--mon-ink);font-weight:500}
.mlog{padding:.7vh 1vw;display:flex;flex-direction:column;gap:.5vh;overflow:auto;min-height:0;flex:1;scrollbar-width:thin}
.ml{display:flex;gap:8px;align-items:flex-start;animation:rise .3s both}
.ml .who{font-family:var(--f-mono);font-size:var(--fs-xs);padding:1px 6px;border-radius:4px;background:#1E8F7B;color:#fff;white-space:nowrap;margin-top:2px}
.ml .who.core{background:#2E6B72}.ml .who.guard{background:#9A3524}.ml .who.eng{background:#5C7F84}.ml .who.audit{background:#3C4F52}.ml .who.eval{background:#0E6E5F}.ml .who.ui{background:#7A5A10}
.ml .txt{flex:1}.ml .txt small{display:block;color:var(--mon-dim)}
.ml .prog{height:5px;background:var(--mon-2);border-radius:3px;margin-top:5px;overflow:hidden}
.ml .prog b{display:block;height:100%;width:0;background:#3ED2B4;transition:width 1.5s ease}
/* cursor */
.cursor{position:absolute;left:0;top:0;width:22px;height:30px;pointer-events:none;z-index:9;transform:translate(-100px,-100px);transition:transform .7s cubic-bezier(.3,.8,.3,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cursor svg{display:block}
.cursor::after{content:"";position:absolute;left:-9px;top:-9px;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);opacity:0;transform:scale(.4)}
.cursor.click::after{animation:ripple .45s ease-out}
@keyframes ripple{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
/* caption + timeline */
.cap p{margin:0 0 .6vh;font-size:clamp(13px,1.15vw,17px)}
.cap p b{color:var(--accent)}
.tl{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.tl button{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font:inherit;color:var(--ink-3)}
.tl button i{display:block;height:6px;border-radius:3px;background:var(--surface-2);margin-bottom:4px}
.tl button.done i{background:var(--accent);opacity:.45}.tl button.on i{background:var(--accent)}
.tl button.on{color:var(--ink);font-weight:600}
.tl button span{font-size:var(--fs-xs);display:block;line-height:1.2}
@media (max-width:1100px){
  .frame{grid-template-columns:clamp(120px,14vw,160px) 1fr;grid-template-rows:auto 1fr auto}
  .top{grid-column:2/3}
  .mon{grid-column:1/3;border-left:0;border-top:1px solid var(--border);max-height:26vh}
  .tl{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:760px){
  body{overflow:auto}.app{height:auto;min-height:100%}
  .frame{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
  .side{grid-row:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}.side .nav{flex-direction:row;flex-wrap:wrap;margin:0}.side .who,.side .newcase{margin:0}
  .top{grid-column:1}.mon{grid-column:1;max-height:none}
  .main{min-height:52vh}
  .g2,.g31,.g13,.g3{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}
  .tl{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){.cursor{transition:none}.ml,.fade{animation:none}.doc .p b,.ml .prog b{transition:none}}

/* annotations */
.note{position:absolute;z-index:8;max-width:clamp(200px,22vw,300px);background:rgba(255,246,219,.9);backdrop-filter:blur(2px);border:1.5px solid #D9B85A;border-radius:8px;padding:8px 10px 8px 34px;font-size:var(--fs-s);line-height:1.35;color:var(--ink);box-shadow:0 6px 18px rgba(12,34,38,.14);pointer-events:none;animation:rise .35s both}
.note b{display:block;font-family:var(--f-display);font-size:var(--fs-s);color:#7A5A10;margin-bottom:2px}
.note .n{position:absolute;left:8px;top:8px;width:20px;height:20px;border-radius:50%;background:#B98A1E;color:#fff;font-family:var(--f-display);font-weight:700;font-size:12px;display:grid;place-items:center}
.note::before{content:"";position:absolute;width:10px;height:10px;background:#FFF6DB;border-left:1.5px solid #D9B85A;border-top:1.5px solid #D9B85A;transform:rotate(-45deg)}
.note.right::before{left:-7px;top:14px}
.note.left::before{right:-7px;top:14px;transform:rotate(135deg)}
.note.below::before{top:-7px;left:16px;transform:rotate(45deg)}
.note.above::before{bottom:-7px;left:16px;transform:rotate(225deg)}
.note.mon{background:rgba(230,244,241,.92);border-color:#3ED2B4}.note.mon b{color:#0E6E5F}.note.mon .n{background:#0E6E5F}
.note.mon::before{background:#E6F4F1;border-color:#3ED2B4}
.hand{position:absolute;inset:0;z-index:12;background:rgba(12,34,38,.86);color:#fff;display:grid;place-items:center;text-align:center;animation:rise .3s both}
.hand .in{max-width:70%}
.hand .k{font-family:var(--f-mono);font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:#94DEA5}
.hand h2{font-family:var(--f-display);font-size:clamp(20px,2.2vw,32px);margin:.4vh 0;line-height:1.15}
.hand p{margin:0;color:#DDE3E2;font-size:var(--fs)}
.hand .who{display:inline-flex;gap:10px;align-items:center;margin-top:1.4vh;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;font-size:var(--fs-s)}
.hand .who i{width:10px;height:10px;border-radius:50%;background:#52E081}
.side .nav div{cursor:default}
.tabs span{cursor:default}
.btn.dis{opacity:.45}

.side .who .sw{display:block;margin-top:4px;color:var(--accent);font-weight:600;cursor:default}
.swmenu{position:absolute;z-index:11;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 28px rgba(12,34,38,.18);min-width:220px;font-size:var(--fs-s);animation:rise .25s both;overflow:hidden}
.swmenu .h{padding:6px 12px;font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--ink-3);border-bottom:1px solid var(--border)}
.swmenu div:not(.h){padding:8px 12px}
.swmenu div.on{background:var(--accent-soft);font-weight:600}
.note.inmon::before{display:none}
.note.inmon{box-shadow:0 -6px 18px rgba(0,0,0,.25)}
</style>

<div class="app">
  <div class="bar">
    <h1>Risk Assessment Workbench <span>· guided walkthrough</span></h1>
    <span class="sp"></span>
    <span class="cnt" id="cnt"></span>
    <button type="button" id="prev">Back</button>
    <button type="button" id="play" class="primary">Play</button>
    <button type="button" id="next">Next</button>
    <button type="button" id="speed" title="Playback speed">1×</button>
  </div>

  <div class="frame" id="frame">
    <aside class="side" id="side"></aside>
    <div class="top" id="top"></div>
    <div class="main" id="main"></div>
    <aside class="mon" id="mon">
      <div class="mhd">
        <div class="row"><span class="dot" id="mdot"></span><b>Harness monitor · H1</b><span style="margin-left:auto;font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--mon-dim)" id="mcore">idle</span></div>
        <div class="st"><span>agents <b id="magents">—</b></span><span>guardrails <b id="mguards">—</b></span><span>audit records <b id="maudit">0</b></span><span>tokens <b id="mtok">0</b></span></div>
      </div>
      <div class="mlog" id="mlog"></div>
    </aside>
    <div class="cursor" id="cur"><svg width="22" height="30" viewBox="0 0 22 30"><path d="M2 2 L2 24 L8 18 L13 29 L17 27 L12 16 L20 16 Z" fill="#0C2226" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
  </div>

  <div class="cap"><p id="capt"></p><div class="tl" id="tl"></div></div>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id);};
var CASE='FCRM-2026-0151';
var NAV={po:['Dashboard','My Queue','Templates','Settings'],an:['Dashboard','Queue','Assurance','Config'],co:['Queue']};
var WHO={po:['Priya Nair','Product Owner · Payments'],an:['Rahul Iyer','FCRM Analyst'],co:['Ana Mendes','Risk Committee']};

function rect(el){var f=$('frame').getBoundingClientRect(),r=el.getBoundingClientRect();return {x:r.left-f.left,y:r.top-f.top,w:r.width,h:r.height,fw:f.width,fh:f.height};}

/* annotations: anchored callouts. side: right|left|below|above. cls 'mon' for backend notes */
function clearNotes(){Array.prototype.forEach.call(document.querySelectorAll('.note,.hand'),function(n){n.remove();});noteN=0;}
function note(sel,title,text,side,cls){
  var el=q(sel);if(!el)return;var r=rect(el);noteN++;
  var n=document.createElement('div');n.className='note '+(side||'right')+' '+(cls||'');n.innerHTML='<span class="n">'+noteN+'</span><b>'+title+'</b>'+text;
  $('frame').appendChild(n);var w=n.offsetWidth,h=n.offsetHeight,x,y;
  if(side==='left'){x=r.x-w-12;y=r.y+Math.min(8,r.h/2-14);}
  else if(side==='below'){x=r.x+8;y=r.y+r.h+10;}
  else if(side==='above'){x=r.x+8;y=r.y-h-10;}
  else{x=r.x+r.w+12;y=r.y+Math.min(8,r.h/2-14);}
  x=Math.max(6,Math.min(x,r.fw-w-6));y=Math.max(6,Math.min(y,r.fh-h-6));
  n.style.left=x+'px';n.style.top=y+'px';
}

/* ---------- player ---------- */
var tl=$('tl');
S.forEach(function(s,k){var b=document.createElement('button');b.type='button';b.innerHTML='<i></i><span>'+(k+1)+' · '+s.label+'</span>';b.addEventListener('click',function(){go(k,true);});tl.appendChild(b);});

function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function runFrom(from){
  clearTimers();var s=S[cur];
  s.actions.forEach(function(a){if(a[0]>=from){timers.push(setTimeout(function(){a[1]();},(a[0]-from)/speed));}});
  if(playing){timers.push(setTimeout(function(){if(cur<S.length-1){go(cur+1,false);}else{playing=false;$('play').textContent='Replay';}},Math.max(0,s.dur-from)/speed));}
}
function go(k,reset){
  clearTimers();cur=k;var s=S[k];
  if(reset){$('mlog').innerHTML='';$('cur').style.transform='translate(-100px,-100px)';}
  s.base();
  $('cnt').textContent=(k+1)+' / '+S.length;
  Array.prototype.forEach.call(tl.children,function(b,i){b.className=i<k?'done':i===k?'on':'';});
  $('prev').disabled=k===0;$('next').textContent=k===S.length-1?'Restart':'Next';
  t0=Date.now();elapsed=0;
  requestAnimationFrame(function(){runFrom(0);});
}
$('prev').addEventListener('click',function(){if(cur>0)go(cur-1,true);});
$('next').addEventListener('click',function(){go(cur===S.length-1?0:cur+1,cur===S.length-1);});
$('play').addEventListener('click',function(){
  if(playing){playing=false;elapsed+=Date.now()-t0;clearTimers();$('play').textContent='Play';return;}
  if($('play').textContent==='Replay'){cur=0;elapsed=0;playing=true;$('play').textContent='Pause';go(0,true);return;}
  playing=true;$('play').textContent='Pause';t0=Date.now();runFrom(elapsed);
});
$('speed').addEventListener('click',function(){speed=speed===1?1.5:speed===1.5?2:1;$('speed').textContent=speed+'×';if(playing){elapsed+=Date.now()-t0;t0=Date.now();runFrom(elapsed);}});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key===' '){e.preventDefault();$('play').click();}});
go(0,true);
})();
