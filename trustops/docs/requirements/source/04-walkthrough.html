<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbench Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: control bar · mocked enterprise workbench (sidebar, topbar, content, docked harness monitor) with an animated cursor · caption · scene timeline.
   Chrome (bar, captions, timeline, callouts, monitor, logo) follows the Myridius brand system. The mocked product frame keeps the BA workbench layout. Fixed light theme. v2 · 2026-10-01 */
:root{color-scheme:light;
  /* Myridius tokens */
  --cloud-white:#FFFFFF; --base-linen:#F6F3F0; --carbon-moss:#0C2226; --quantum-leaf:#194247; --virtual-tide:#09A78D; --digital-pavo:#337077; --pulse-green:#52E081; --neural-beam:#E5FD84;
  --chart-4:#94DEA5; --chart-5:#CBEBBD; --chart-7:#285C62; --chart-8:#163439; --destructive:#C84B47;
  /* page chrome */
  --bg:var(--base-linen); --ink:var(--carbon-moss); --ink-2:var(--quantum-leaf); --ink-3:var(--digital-pavo); --accent:var(--virtual-tide);
  /* product frame (BA workbench) */
  --surface:#FFFFFF; --surface-2:#E6EBE9; --surface-3:#F6F8F7; --border:rgba(25,66,71,.16);
  --accent-soft:#DDF3EE; --leaf:#CBEBBD;
  --warn:#7A5A10; --warn-bg:#FBF1D9; --bad:#9A3524; --bad-bg:#F7E3DE; --ok:#1F6B3F; --ok-bg:#E1F4E6;
  /* monitor (dark surface) */
  --mon:var(--carbon-moss); --mon-2:#163439; --mon-ink:var(--base-linen); --mon-dim:#A9C4C2;
  --fs:clamp(12px,1.05vw,15.5px); --fs-s:clamp(11px,.92vw,13.5px); --fs-xs:clamp(10px,.8vw,12px);
  --font:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --radius-sm:6px; --radius-md:12px; --radius-pill:999px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45;overflow:hidden}
.num{font-variant-numeric:tabular-nums;font-weight:500}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:.8vh;padding:1vh 1.2vw}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar h1{font-size:clamp(18px,1.8vw,26px);margin:0;color:var(--quantum-leaf);font-weight:700;letter-spacing:-.015em}
.bar h1 span{color:var(--digital-pavo);font-weight:600}
.bar .sp{flex:1}
.bar button{font:600 var(--fs-s) var(--font);letter-spacing:.02em;padding:8px 18px;border-radius:var(--radius-pill);border:1.5px solid var(--quantum-leaf);background:transparent;color:var(--quantum-leaf);cursor:pointer}
.bar button:hover{background:rgba(25,66,71,.08)}
.bar button.primary{background:var(--virtual-tide);border-color:var(--virtual-tide);color:#fff;min-width:92px}
.bar button.primary:hover{background:#088B76;transform:translateY(-1px);box-shadow:0 8px 24px rgba(9,167,141,.25)}
.bar button:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.bar button:focus-visible{outline:2px solid var(--virtual-tide);outline-offset:2px}
.bar .cnt{font-size:var(--fs-s);color:var(--ink-3);font-weight:500}
/* frame */
.frame{position:relative;display:grid;grid-template-columns:clamp(130px,12vw,190px) 1fr clamp(260px,25vw,380px);grid-template-rows:auto 1fr;background:var(--surface);border:1px solid rgba(25,66,71,.12);border-radius:var(--radius-md);overflow:hidden;min-height:0;box-shadow:0 1px 3px rgba(12,34,38,.04)}
.side{grid-row:1/3;background:var(--surface-3);border-right:1px solid var(--border);padding:1.4vh 1vw;display:flex;flex-direction:column;gap:.6vh}
.side .brand{font-weight:700;font-size:clamp(15px,1.35vw,20px);color:var(--quantum-leaf);letter-spacing:-.01em}
.side .brand small{display:block;font-weight:600;font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.side .newcase{margin-top:1vh;background:var(--quantum-leaf);color:#fff;border-radius:var(--radius-sm);padding:.8vh .8vw;font-weight:600;text-align:center;font-size:var(--fs-s)}
.side .nav{margin-top:.8vh;display:flex;flex-direction:column;gap:3px}
.side .nav div{padding:.75vh .7vw;border-radius:var(--radius-sm);color:var(--ink-2);font-size:var(--fs-s);cursor:default}
.side .nav div.on{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--virtual-tide)}
.side .who{margin-top:auto;padding:.8vh .7vw;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:var(--fs-s)}
.side .who b{display:block}.side .who small{color:var(--ink-3);font-size:var(--fs-xs)}
.side .who .sw{display:block;margin-top:4px;color:var(--digital-pavo);font-weight:600;cursor:default}
.top{grid-column:2/4;display:flex;align-items:center;gap:12px;padding:1vh 1.1vw;border-bottom:1px solid var(--border)}
.top .crumb{color:var(--ink-3);font-size:var(--fs-s)}
.top .title{font-weight:600}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:var(--radius-pill);font-size:var(--fs-xs);font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.ac{background:var(--accent-soft);color:var(--digital-pavo)}
.main{padding:1.1vh 1.1vw;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.9vh}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);font-size:var(--fs-s);flex-wrap:wrap}
.tabs span{padding:.5vh .8vw;color:var(--ink-3);border-bottom:2px solid transparent;cursor:default}
.tabs span.on{color:var(--ink);font-weight:600;border-bottom-color:var(--virtual-tide)}
.grid{display:grid;gap:.8vw;min-height:0}
.g2{grid-template-columns:1fr 1fr}.g31{grid-template-columns:1.4fr 1fr}.g13{grid-template-columns:1fr 1.5fr}.g3{grid-template-columns:repeat(3,1fr)}
.box{background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:1vh 1vw;min-height:0;overflow:hidden}
.box h4{margin:0 0 .6vh;font-size:var(--fs-s);font-weight:600;color:var(--ink-2)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vw}
.kpi .box b{display:block;font-size:clamp(22px,2.2vw,34px);line-height:1;color:var(--quantum-leaf);font-weight:800;letter-spacing:-.02em}
.kpi .box small{color:var(--ink-3);font-size:var(--fs-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
table.t{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.t th{text-align:left;color:var(--ink-3);font-weight:600;padding:.4vh .5vw;border-bottom:1px solid var(--border);font-size:var(--fs-xs)}
.t td{padding:.55vh .5vw;border-bottom:1px solid var(--border);vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.t tr.hl td{background:var(--warn-bg)}.t tr.hlok td{background:var(--ok-bg)}.t tr.hlac td{background:var(--accent-soft)}
.src{font-size:var(--fs-xs);font-weight:600;color:var(--digital-pavo);background:var(--accent-soft);padding:0 6px;border-radius:4px;white-space:nowrap}
.src.from{color:var(--ink-2);background:var(--surface-2)}
.src.own{color:var(--warn);background:var(--warn-bg)}
.btn{display:inline-block;padding:4px 11px;border-radius:5px;font-size:var(--fs-xs);font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn.p{background:var(--quantum-leaf);border-color:var(--quantum-leaf);color:#fff}
.btn.a{background:var(--virtual-tide);border-color:var(--virtual-tide);color:#fff}
.btn.d{border-color:var(--bad);color:var(--bad)}
.btn.done{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.btn.dis{opacity:.5}
.ring{width:clamp(64px,6.5vw,96px);height:clamp(64px,6.5vw,96px);border-radius:50%;background:conic-gradient(var(--virtual-tide) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;position:relative}
.ring::after{content:attr(data-v);position:absolute;inset:14%;background:var(--surface-3);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:clamp(14px,1.3vw,20px);color:var(--quantum-leaf)}
.score{display:flex;gap:1.2vw;align-items:center}
.big{font-weight:800;font-size:clamp(26px,2.8vw,44px);line-height:1;color:var(--quantum-leaf);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.arrow{color:var(--ink-3);font-size:clamp(16px,1.5vw,22px)}
.band{display:inline-block;padding:2px 9px;border-radius:5px;font-weight:700;font-size:var(--fs-s)}
.b1{background:var(--ok-bg);color:var(--ok)}.b2{background:var(--leaf);color:#1F5A33}.b3{background:var(--warn-bg);color:var(--warn)}.b4{background:var(--bad-bg);color:var(--bad)}
.upload{border:1.5px dashed var(--border);border-radius:8px;padding:1.2vh 1vw;display:flex;flex-direction:column;gap:.7vh;min-height:14vh}
.doc{display:flex;gap:8px;align-items:center;font-size:var(--fs-s)}
.doc i{width:12px;height:15px;border:1.5px solid var(--ink-3);border-radius:2px;display:inline-block;flex:none}
.doc .p{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.doc .p b{display:block;height:100%;width:0;background:var(--virtual-tide);transition:width 1.4s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1.1vh 1vw;box-shadow:0 10px 28px rgba(12,34,38,.14)}
.modal h4{margin:0 0 .5vh;font-size:var(--fs);color:var(--ink)}
label.l{display:block;font-size:var(--fs-xs);color:var(--ink-2);font-weight:600;margin-top:.6vh}
.field{border:1px solid var(--border);border-radius:5px;padding:.55vh .6vw;background:var(--surface);font-size:var(--fs-s);min-height:3vh}
.field.focus{border-color:var(--virtual-tide);box-shadow:0 0 0 3px rgba(9,167,141,.15)}
.field .caret{display:inline-block;width:1px;height:1em;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.banner{border-radius:8px;padding:.9vh 1vw;font-size:var(--fs-s);border-left:3px solid}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}.banner.ok{background:var(--ok-bg);border-color:var(--ok)}.banner.ac{background:var(--accent-soft);border-color:var(--virtual-tide)}.banner.bad{background:var(--bad-bg);border-color:var(--bad)}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:.7vw}
.vote{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.8vh .7vw;text-align:center;font-size:var(--fs-s)}
.vote b{display:block}.vote .st{margin-top:.5vh;font-weight:700}
.lock{font-size:var(--fs-xs);color:var(--ink-3);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.lock svg{width:11px;height:12px}
.qa{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.9vh 1vw;font-size:var(--fs-s)}
.qa .q{font-weight:600}.qa .a{margin-top:.6vh;color:var(--ink-2)}
.qa .refs{margin-top:.6vh;display:flex;gap:6px;flex-wrap:wrap}
.ref{font-size:var(--fs-xs);font-weight:600;padding:1px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;padding:.4vh 0;font-size:var(--fs-s)}
.check i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);display:inline-grid;place-items:center;flex:none;background:transparent}
.check.ok i{background:var(--ok);border-color:var(--ok)}
.check.ok i::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.cb{width:14px;height:14px;border:1.5px solid var(--ink-3);border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:6px;position:relative}
.cb.on{background:var(--virtual-tide);border-color:var(--virtual-tide)}
.cb.on::after{content:"";position:absolute;left:3px;top:2px;width:6px;height:3px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg)}
.login{margin:auto;width:min(420px,90%);text-align:center;padding:3vh 2vw}
.login .brand{font-weight:700;font-size:clamp(24px,2.4vw,36px);color:var(--quantum-leaf);letter-spacing:-.015em}
.login .brand small{display:block;font-weight:600;font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.login .btn{display:block;margin:2vh auto 0;padding:1vh 1.4vw;font-size:var(--fs)}
.aicard{border:1px solid var(--virtual-tide);background:var(--accent-soft);border-radius:8px;padding:.8vh 1vw;font-size:var(--fs-s);display:flex;gap:10px;align-items:flex-start}
.aicard .dot{width:9px;height:9px;border-radius:50%;background:var(--virtual-tide);margin-top:6px;flex:none;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(9,167,141,.25)}50%{box-shadow:0 0 0 7px rgba(9,167,141,.12)}}
.aicard.still .dot{animation:none}
#full{table-layout:fixed}#full td:first-child{width:26%;color:var(--ink-2)}#full td:nth-child(2){width:46%}#full .src{white-space:normal;display:inline;line-height:1.9}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:.6vw;font-size:var(--fs-s)}
.diff .v{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.6vh .7vw}
.diff .v h5{margin:0 0 .4vh;font-size:var(--fs-xs);color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.diff .chg{background:var(--warn-bg)}
.thread{display:flex;flex-direction:column;gap:.6vh;font-size:var(--fs-s)}
.msg{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.7vh .9vw}
.msg b{display:block;font-size:var(--fs-xs);color:var(--ink-3)}
.msg.me{border-color:var(--virtual-tide)}
.hidden{display:none!important}
.fade{animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* harness monitor · dark surface */
.mon{border-left:1px solid var(--border);background:var(--mon);color:var(--mon-ink);display:flex;flex-direction:column;min-height:0;font-size:var(--fs-s)}
.mon .mhd{padding:.9vh 1vw;border-bottom:1px solid var(--mon-2);display:flex;flex-direction:column;gap:3px}
.mon .mhd .row{display:flex;align-items:center;gap:8px}
.mon .mhd b{font-weight:600}
.mon .mhd .dot{width:8px;height:8px;border-radius:50%;background:var(--pulse-green)}
.mon .mhd .dot.run{animation:pulse2 1.2s infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 3px rgba(82,224,129,.25)}50%{box-shadow:0 0 0 7px rgba(82,224,129,.1)}}
.mon .mhd .core{margin-left:auto;font-size:var(--fs-xs);color:var(--pulse-green);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mon .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:var(--fs-xs);color:var(--mon-dim)}
.mon .st span b{color:var(--mon-ink);font-weight:600}
.mlog{padding:.7vh 1vw;display:flex;flex-direction:column;gap:.5vh;overflow:auto;min-height:0;flex:1;scrollbar-width:thin}
.ml{display:flex;gap:8px;align-items:flex-start;animation:rise .3s both}
.ml .who{font-size:var(--fs-xs);font-weight:600;padding:1px 7px;border-radius:4px;background:var(--virtual-tide);color:var(--carbon-moss);white-space:nowrap;margin-top:2px}
.ml .who.core{background:var(--digital-pavo);color:var(--base-linen)}.ml .who.guard{background:var(--destructive);color:#fff}.ml .who.eng{background:var(--chart-4);color:var(--carbon-moss)}.ml .who.audit{background:var(--chart-8);color:var(--base-linen);border:1px solid rgba(82,224,129,.3)}.ml .who.eval{background:var(--chart-7);color:var(--base-linen)}.ml .who.ui{background:var(--neural-beam);color:var(--carbon-moss)}
.ml .txt{flex:1}.ml .txt small{display:block;color:var(--mon-dim)}
.ml .prog{height:5px;background:var(--mon-2);border-radius:3px;margin-top:5px;overflow:hidden}
.ml .prog b{display:block;height:100%;width:0;background:var(--pulse-green);transition:width 1.5s ease}
/* cursor */
.cursor{position:absolute;left:0;top:0;width:22px;height:30px;pointer-events:none;z-index:9;transform:translate(-100px,-100px);transition:transform .7s cubic-bezier(.3,.8,.3,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cursor svg{display:block}
.cursor::after{content:"";position:absolute;left:-9px;top:-9px;width:26px;height:26px;border-radius:50%;border:2px solid var(--virtual-tide);opacity:0;transform:scale(.4)}
.cursor.click::after{animation:ripple .45s ease-out}
@keyframes ripple{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
/* caption + timeline + logo */
.foot{display:grid;grid-template-columns:auto 1fr;gap:1.2vw;align-items:end}
.brandmark{display:flex;align-items:center;gap:9px;padding-bottom:2px}
.brandmark .mark{width:28px;height:28px;border-radius:50%;background:var(--pulse-green);color:var(--carbon-moss);display:grid;place-items:center;font-weight:600;font-style:italic;font-size:15px;line-height:1}
.brandmark .word{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink-2)}
.cap p{margin:0 0 .6vh;font-size:clamp(13px,1.15vw,17px);color:var(--quantum-leaf)}
.cap p b{color:var(--digital-pavo)}
.tl{display:grid;grid-template-columns:repeat(21,1fr);gap:4px}
.tl button{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;font:inherit;color:var(--ink-3)}
.tl button i{display:block;height:6px;border-radius:3px;background:rgba(25,66,71,.12);margin-bottom:4px}
.tl button.done i{background:var(--virtual-tide);opacity:.45}.tl button.on i{background:var(--virtual-tide)}
.tl button.on{color:var(--ink);font-weight:600}
.tl button span{font-size:var(--fs-xs);display:block;line-height:1.2}
.tl button:focus-visible{outline:2px solid var(--virtual-tide);outline-offset:2px;border-radius:3px}
@media (max-width:1100px){
  .frame{grid-template-columns:clamp(120px,14vw,160px) 1fr;grid-template-rows:auto 1fr auto}
  .top{grid-column:2/3}
  .mon{grid-column:1/3;border-left:0;border-top:1px solid var(--border);max-height:26vh}
  .tl{grid-template-columns:repeat(11,1fr)}
}
@media (max-width:760px){
  body{overflow:auto}.app{height:auto;min-height:100%}
  .frame{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
  .side{grid-row:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px}.side .nav{flex-direction:row;flex-wrap:wrap;margin:0}.side .who,.side .newcase{margin:0}
  .top{grid-column:1}.mon{grid-column:1;max-height:none}
  .main{min-height:52vh}
  .g2,.g31,.g13,.g3{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}
  .tl{grid-template-columns:repeat(4,1fr)}.foot{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.cursor{transition:none}.ml,.fade{animation:none}.doc .p b,.ml .prog b{transition:none}}
/* annotations · Myridius hand-drawn note pattern on a dark card so the lime stays legible */
.note{position:absolute;z-index:8;max-width:clamp(210px,23vw,320px);background:var(--carbon-moss);border:1px solid rgba(82,224,129,.25);border-radius:var(--radius-md);padding:9px 12px 10px 36px;font-size:var(--fs-s);line-height:1.4;color:var(--base-linen);box-shadow:0 8px 24px rgba(12,34,38,.22);pointer-events:none;animation:rise .35s both}
.note b{display:block;font-family:"Caveat",var(--font);font-size:calc(var(--fs-s) * 1.45);font-weight:600;color:var(--neural-beam);margin-bottom:1px;line-height:1.1}
.note .n{position:absolute;left:9px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--pulse-green);color:var(--carbon-moss);font-weight:700;font-size:12px;display:grid;place-items:center}
.note::before{content:"";position:absolute;width:10px;height:10px;background:var(--carbon-moss);border-left:1px solid rgba(82,224,129,.25);border-top:1px solid rgba(82,224,129,.25);transform:rotate(-45deg)}
.note.right::before{left:-6px;top:14px}
.note.left::before{right:-6px;top:14px;transform:rotate(135deg)}
.note.below::before{top:-6px;left:16px;transform:rotate(45deg)}
.note.above::before{bottom:-6px;left:16px;transform:rotate(225deg)}
.note.inmon::before{display:none}
.note.inmon{background:var(--mon-2);border-color:rgba(82,224,129,.35)}
.hand{position:absolute;inset:0;z-index:12;background:rgba(12,34,38,.9);color:var(--base-linen);display:grid;place-items:center;text-align:center;animation:rise .3s both}
.hand .in{max-width:70%}
.hand .k{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--pulse-green);font-weight:600}

.hand .who i{width:10px;height:10px;border-radius:50%;background:var(--pulse-green)}
.swmenu{position:absolute;z-index:11;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 28px rgba(12,34,38,.18);min-width:220px;font-size:var(--fs-s);animation:rise .25s both;overflow:hidden}
.swmenu .h{padding:6px 12px;font-size:var(--fs-xs);color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--border)}
.swmenu div:not(.h){padding:8px 12px}
.swmenu div.on{background:var(--accent-soft);font-weight:600}

/* ---------- player ---------- */
var tl=$('tl');
S.forEach(function(s,k){var b=document.createElement('button');b.type='button';b.innerHTML='<i></i><span>'+(k+1)+' · '+s.label+'</span>';b.addEventListener('click',function(){go(k,true);});tl.appendChild(b);});
tl.style.gridTemplateColumns='repeat('+S.length+',1fr)';

function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function runFrom(from){
  clearTimers();var s=S[cur];
  s.actions.forEach(function(a){if(a[0]>=from){timers.push(setTimeout(function(){a[1]();},(a[0]-from)/speed));}});
  if(playing){timers.push(setTimeout(function(){if(cur<S.length-1){go(cur+1,false);}else{playing=false;$('play').textContent='Replay';}},Math.max(0,s.dur-from)/speed));}
}
/* jumping to a scene: counters show the state at the start of that scene, not whatever happened to be on screen */
function syncCounters(k){var last=0;D.audit.forEach(function(r){if(r.scene<=k)last=Math.max(last,r.n);});audit=k<=1?0:last;$('maudit').textContent=audit;}
function go(k,reset){
  clearTimers();cur=k;var s=S[k];
  if(reset){$('mlog').innerHTML='';$('cur').style.transform='translate(-100px,-100px)';syncCounters(k);}
  s.base();
  $('cnt').textContent=(k+1)+' / '+S.length;
  Array.prototype.forEach.call(tl.children,function(b,i){b.className=i<k?'done':i===k?'on':'';});
  $('prev').disabled=k===0;$('next').textContent=k===S.length-1?'Restart':'Next';
  t0=Date.now();elapsed=0;
  requestAnimationFrame(function(){runFrom(0);});
}
$('prev').addEventListener('click',function(){if(cur>0)go(cur-1,true);});
$('next').addEventListener('click',function(){go(cur===S.length-1?0:cur+1,cur===S.length-1);});
$('play').addEventListener('click',function(){
  if(playing){playing=false;elapsed+=Date.now()-t0;clearTimers();$('play').textContent='Play';return;}
  if($('play').textContent==='Replay'){cur=0;elapsed=0;playing=true;$('play').textContent='Pause';go(0,true);return;}
  playing=true;$('play').textContent='Pause';t0=Date.now();runFrom(elapsed);
});
$('speed').addEventListener('click',function(){speed=speed===1?1.5:speed===1.5?2:1;$('speed').textContent=speed+'×';if(playing){elapsed+=Date.now()-t0;t0=Date.now();runFrom(elapsed);}});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key===' '){e.preventDefault();$('play').click();}});
go(0,true);
})();
