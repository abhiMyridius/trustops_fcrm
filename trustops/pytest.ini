[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src/backend ops/scripts
asyncio_mode = auto
addopts = -q --strict-markers --strict-config -p no:deepeval
markers =
    integration: requires testcontainers (Mongo/RabbitMQ/MinIO)
    golden: scoring golden-case tests (never skip; see ADR-13)
    e2e: Playwright-driven, requires the composed stack
    resilience: kill/restart drills against the running stack (make resilience); never part of make check
    drill(id, title): names a resilience drill for the PASS/FAIL table
