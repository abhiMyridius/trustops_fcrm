[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src/backend
asyncio_mode = auto
addopts = -q --strict-markers --strict-config
markers =
    integration: requires testcontainers (Mongo/RabbitMQ/MinIO)
    golden: scoring golden-case tests (never skip; see ADR-13)
    e2e: Playwright-driven, requires the composed stack
