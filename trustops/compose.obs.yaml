# Observability add-on (ADR-09, design A §11.5). On by default: `make up` and
# `make up-infra` always pass `-f docker-compose.yaml -f compose.obs.yaml`.
#
#   otel-collector  OTLP in on 4317 (gRPC) / 4318 (HTTP); Prometheus exporter
#                   on 8889; health_check extension on 13133
#   jaeger          traces UI on 16686 (OTLP from the collector)
#   prometheus      9090, scrapes the collector and the RabbitMQ plugin
#   grafana         3000, provisioned datasources + three dashboards
#
# Grafana admin: user ${GF_SECURITY_ADMIN_USER:-admin}, password
# GF_SECURITY_ADMIN_PASSWORD from .env (required; `make env` generates one).

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    # Base config + per-ENV overlay; only env/local.yaml enables the debug
    # exporter.
    command:
      - --config=/etc/otelcol/collector.yaml
      - --config=/etc/otelcol/env/${ENV:-local}.yaml
    environment:
      ENV: ${ENV:-local}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_HOST_PORT:-4318}:4318"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTEL_PROM_HOST_PORT:-8889}:8889"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTEL_HEALTH_HOST_PORT:-13133}:13133"
    volumes:
      - ./ops/otel:/etc/otelcol:ro
    # The contrib image is distroless (no shell, no HTTP client), so there
    # is no in-container healthcheck; `make up-infra` probes :13133 from the
    # host instead, and dependants wait on service_started.

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${JAEGER_UI_HOST_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.6.3
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/case-throughput.json
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  prometheus_data:
  grafana_data:
