# TrustOps base stack (design A §11; ports ADR-20). 22 containers with
# compose.obs.yaml (on by default in `make up`):
#   infra   mongo, mongo-init*, rabbitmq, redis, minio, minio-init*, opa
#   obs     otel-collector, jaeger, prometheus, grafana        (compose.obs.yaml)
#   S1–S5   case, scoring, policy, audit, decision; X1 identity
#   H1–H4   caseflow, agent-worker ×2, ingestion-worker, context-worker
#   edge    gateway (G1), web (W1)                             (* one-shot)
#
#   make up-infra   infra + obs only (works today)
#   make up         everything (needs the service/worker/web Dockerfiles)
#
# Secrets and per-machine values come from the root .env (compose reads it
# for ${...} interpolation; `make env` creates it from .env.example with
# generated local secrets). Each container receives ONLY the variables it
# needs through its own `environment:` block — there is deliberately no
# blanket `env_file: .env`, so e.g. identity never sees AWS keys and the
# case service never sees the audit writer's password. Secrets use
# ${VAR:?...} so a missing one stops compose before anything starts (no
# hard-coded fallbacks; one of the verified AEO defects).
#
# Host ports bind to ${BIND_ADDRESS:-127.0.0.1} and every one can be moved
# with a *_HOST_PORT variable (the defaults are ADR-20's numbers).
#
# The API services (identity, case, scoring, policy, audit, decision) are
# NOT published to the host: only `expose:`d on the compose network, where
# the gateway (G1) and the workers reach them. Every request from outside
# goes through the gateway on ${GATEWAY_HOST_PORT:-8080}, so there is no
# path that bypasses the gateway's auth_request -- and each service also
# verifies the bearer token and asks OPA itself (fcrm_common.auth/authz),
# so a container-network caller gets the same 401/403 (D-23 follow-up).

name: trustops

# ── shared fragments ─────────────────────────────────────────────────────
x-app-env: &app-env
  ENV: ${ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MONGODB_URI: mongodb://fcrm_app:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}@mongo:27017/?replicaSet=rs0&authSource=admin
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}:${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}@rabbitmq:5672/
  REDIS_URL: ${REDIS_URL:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  IDENTITY_JWKS_URL: http://api:8000/api/fcrm/auth/.well-known/jwks.json
  IDENTITY_VALIDATE_URL: http://api:8000/api/fcrm/auth/core/validate
  OPA_URL: http://opa:8181
  SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in .env}
  SEED_PATH: ${SEED_PATH:-}
  SEED_ON_EMPTY: ${SEED_ON_EMPTY:-true}
  GATEWAY_ORIGIN: ${GATEWAY_ORIGIN:-http://localhost:8080}

# MinIO (local S3). The AWS path unsets S3_ENDPOINT_URL and uses real S3.
x-s3-env: &s3-env
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  S3_BUCKET_UPLOADS: uploads
  S3_BUCKET_CANONICAL: canonical
  S3_BUCKET_PACKS: packs
  S3_BUCKET_VECTORS: vectors
  S3_BUCKET_JOBS: jobs

# Bedrock / S3 Vectors credentials (live mode only; empty = replay/memory).
# One region setting, AWS_DEFAULT_REGION, passed under both names: boto3 and
# Pydantic AI's BedrockProvider read AWS_DEFAULT_REGION (without it, live mode
# fails with "You must provide a region_name"), and the cloned context
# engine reads AWS_REGION.
x-aws-env: &aws-env
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

# ADR-12 deterministic modes, plus the embedding/vector settings S3 and H4
# share. Model ids are never set here: they live only in ai/models/tiers.yaml
# (EMBEDDING_MODEL empty = take it from tiers.yaml).
x-vector-env: &vector-env
  VECTOR_BACKEND: ${VECTOR_BACKEND:-memory}
  S3_VECTORS_BUCKET: ${S3_VECTORS_BUCKET:-fcrm-vectors}
  S3_VECTORS_REGION: ${S3_VECTORS_REGION:-us-east-1}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dummy}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSION: "1024"

# Base URLs include each service's public prefix on the api process (the
# gateway strips nothing, so neither do service-to-service clients).
x-service-urls: &service-urls
  CASE_SERVICE_URL: http://api:8000/api/fcrm
  SCORING_SERVICE_URL: http://api:8000/api/fcrm/scoring
  POLICY_SERVICE_URL: http://api:8000/api/fcrm/policy
  AUDIT_SERVICE_URL: http://api:8000/api/fcrm/audit
  DECISION_SERVICE_URL: http://api:8000/api/fcrm/decision

x-service: &service
  restart: unless-stopped
  stop_grace_period: 30s
  init: true

x-worker: &worker
  restart: unless-stopped
  stop_grace_period: 70s
  init: true

# Health probes use the image's own Python stdlib, so they do not depend on
# any package being importable. A non-2xx (/readyz returns 503 on `fail`)
# raises and exits non-zero.
x-health-timing: &health-timing
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

services:
  # ── D1 MongoDB 8 (single-node replica set rs0) ─────────────────────────
  # The entrypoint (ops/mongo/entrypoint.sh) also runs the idempotent init
  # (replica set, users incl. the insert-only audit writer, validators,
  # indexes) and only then writes the readiness marker the healthcheck waits
  # for, so `healthy` means "initialised" and there is no init container.
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    entrypoint: ["bash", "/opt/fcrm/entrypoint.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_AUDIT_WRITER_PASSWORD: ${MONGO_AUDIT_WRITER_PASSWORD:?set MONGO_AUDIT_WRITER_PASSWORD in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./ops/mongo/entrypoint.sh:/opt/fcrm/entrypoint.sh:ro
      - ./ops/mongo/init:/opt/fcrm/init:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /run/fcrm-mongo/init.done &&
          mongosh --quiet --norc
          --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "quit(rs.status().ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s

  # ── X3 RabbitMQ 4 (definitions imported at boot) ───────────────────────
  rabbitmq:
    image: rabbitmq:4.0-management
    hostname: rabbitmq          # stable node name, so the data volume survives recreation
    restart: unless-stopped
    # Adds the .env user to a runtime copy of definitions.json (see the script).
    entrypoint: ["bash", "/opt/fcrm/entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
      - ./ops/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./ops/rabbitmq/20-fcrm.conf:/etc/rabbitmq/conf.d/20-fcrm.conf:ro
      - ./ops/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./ops/rabbitmq/entrypoint.sh:/opt/fcrm/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ── X7 Redis 7.4 (cache only: no persistence, LRU) ─────────────────────
  # Optional (profile `cache`, `make up-cache`): nothing needs it. When it is
  # up, REDIS_URL points the api process at it for SSE fan-out; with REDIS_URL
  # empty (the default) streams fan out in process.
  redis:
    image: redis:7.4-alpine
    profiles: [cache]
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── D2 MinIO (S3 API) ──────────────────────────────────────────────────
  # The upstream minio/minio and quay.io/minio images are no longer
  # pullable anonymously; MINIO_IMAGE defaults to the pinned Bitnami build
  # (MinIO server + mc in one image). The entrypoint
  # (ops/minio/entrypoint.sh) starts `minio server`, runs the idempotent
  # bucket init and only then writes the readiness marker the healthcheck
  # waits for, so `healthy` means "buckets exist" and there is no init
  # container.
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2025.7.23}
    restart: unless-stopped
    entrypoint: ["bash", "/opt/fcrm/entrypoint.sh"]
    command: ["server", "/bitnami/minio/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MC_HOST_local: http://localhost:9000
    volumes:
      - minio_data:/bitnami/minio/data
      - ./ops/minio/entrypoint.sh:/opt/fcrm/entrypoint.sh:ro
      - ./ops/minio/init.sh:/opt/fcrm/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/fcrm-minio-init.done && mc --config-dir /tmp/.mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ── X2 OPA (route authz + agent tool permits) ──────────────────────────
  # The -debug variant only adds busybox, which the healthcheck needs
  # (the static image has no HTTP client).
  opa:
    image: openpolicyagent/opa:1.15.2-debug
    restart: unless-stopped
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - --log-format=json
      - --set=decision_logs.console=true
      - /policy
      - /data
    volumes:
      - ./ops/opa/policy:/policy:ro
      - ./ops/opa/data:/data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8181/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── api: X1 identity + S1 case + S2 scoring + S3 policy + S4 audit + S5 decision
  # One process (fcrm_api.main:app, ADR-26). The services are mounted under their
  # public prefixes, so the gateway still strips nothing. S4's insert-only Mongo
  # credential is a separate MONGODB_URI_AUDIT_WRITER used only by S4's client.
  api:
    <<: *service
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    image: trustops/backend:local
    command: ["uvicorn", "fcrm_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mongo:
        condition: service_healthy
      opa:
        condition: service_healthy
    environment:
      <<: [*app-env, *s3-env, *aws-env, *vector-env]
      OTEL_SERVICE_NAME: fcrm-api
      OTEL_RESOURCE_ATTRIBUTES: component.id=api,service.namespace=trustops
      MONGODB_URI_AUDIT_WRITER: mongodb://fcrm_audit_writer:${MONGO_AUDIT_WRITER_PASSWORD:?set MONGO_AUDIT_WRITER_PASSWORD in .env}@mongo:27017/fcrm_audit?replicaSet=rs0&authSource=admin
      # X1 identity
      JWT_KEY_FILE: /keys/jwt.pem
      JWT_ACCESS_TTL_S: "900"
      JWT_REFRESH_TTL_S: "28800"
      JWT_ISSUER: fcrm-identity
      JWT_AUDIENCE: fcrm
      REFRESH_COOKIE_NAME: fcrm_refresh
      DEMO_USERS_PASSWORD_HASH: ${DEMO_USERS_PASSWORD_HASH:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10/minute}
      # S1 case
      UPLOAD_MAX_BYTES: "52428800"
      UPLOAD_ALLOWED_EXTENSIONS: .pdf,.docx,.xlsx,.pptx,.csv,.md,.txt
      SSE_HEARTBEAT_S: "15"
      # S2 scoring
      SEED_RECOMPUTE_ON_START: ${SEED_RECOMPUTE_ON_START:-true}
      # S3 policy
      RRF_K: "60"
      SEARCH_TOP_K_MAX: "30"
      # S5 decision
      COMMITTEE_QUORUM: "3"
    expose:
      - "8000"
    volumes:
      - ./jwt_keys:/keys:ro          # `make keys` writes jwt.pem / jwt.pub.pem
    healthcheck:
      <<: *health-timing
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=4).status == 200 else 1)"]

  # ── harness: H1 caseflow + H2 agent-worker (H3/H4 join as their entry points land)
  # One process (python -m fcrm_harness, ADR-26) on the same image as api: one
  # broker, one Mongo client (fcrm_harness) and one health endpoint on 9100.
  # H2 runs AGENT_PREFETCH jobs at once instead of the two replicas it used to.
  harness:
    <<: *worker
    image: trustops/backend:local
    command: ["python", "-m", "fcrm_harness"]
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      opa:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      <<: [*app-env, *service-urls, *s3-env, *aws-env]
      OTEL_SERVICE_NAME: fcrm-harness
      OTEL_RESOURCE_ATTRIBUTES: component.id=harness,service.namespace=trustops
      MONGODB_DB: fcrm_harness
      CASEFLOW_PREFETCH: "16"
      AGENT_PREFETCH: "4"
      FCRM_LLM_MODE: live
      BEDROCK_REGION_FALLBACK: ${BEDROCK_REGION_FALLBACK:-us-west-2}
      # The ai/ root, not a path to tiers.yaml or to ai/prompts: both
      # fcrm_agents.models.load_tiers_config and fcrm_prompts.PromptLibrary
      # expect this same root directory (D-15).
      PROMPTS_DIR: /app/ai
      AGENT_MAX_TOOL_CALLS: "12"
    expose:
      - "9100"
    volumes:
      - ./ai:/app/ai:ro
    healthcheck:
      <<: *health-timing
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:9100/readyz', timeout=4).status == 200 else 1)"]

  # ── G1 gateway ─────────────────────────────────────────────────────────
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-8080}:8080"
    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ops/nginx/snippets/proxy-common.conf:/etc/nginx/snippets/proxy-common.conf:ro
      - ./ops/nginx/snippets/web-upstream.conf:/etc/nginx/snippets/web-upstream.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── W1 web (nginx-served static build of src/frontend) ──────────────────────
  # Reached through the gateway at http://localhost:8080/. compose.dev.yaml
  # swaps it for the vite dev server on 5173.
  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    image: trustops/web:local
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 12

  # ══ Observability (profile `obs`, `make up-obs`; ADR-09, design A §11.5) ═══
  #   otel-collector  OTLP in on 4317 (gRPC) / 4318 (HTTP); Prometheus exporter
  #                   on 8889; health_check extension on 13133
  #   jaeger          traces UI on 16686 (OTLP from the collector)
  #   prometheus      9090, scrapes the collector and the RabbitMQ plugin
  #   grafana         3000, provisioned datasources + three dashboards
  # `make up-obs` also sets OTEL_EXPORTER_OTLP_ENDPOINT so the api and harness
  # export to the collector; without it they trace in process and export nothing.
  # Grafana admin: user ${GF_SECURITY_ADMIN_USER:-admin}, password
  # GF_SECURITY_ADMIN_PASSWORD from .env (required; `make env` generates one).
  otel-collector:
    profiles: [obs]
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    # Base config + per-ENV overlay; only env/local.yaml enables the debug
    # exporter.
    command:
      - --config=/etc/otelcol/collector.yaml
      - --config=/etc/otelcol/env/${ENV:-local}.yaml
    environment:
      ENV: ${ENV:-local}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTLP_HTTP_HOST_PORT:-4318}:4318"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTEL_PROM_HOST_PORT:-8889}:8889"
      - "${BIND_ADDRESS:-127.0.0.1}:${OTEL_HEALTH_HOST_PORT:-13133}:13133"
    volumes:
      - ./ops/otel:/etc/otelcol:ro
    # The contrib image is distroless (no shell, no HTTP client), so there
    # is no in-container healthcheck; `make up-infra` probes :13133 from the
    # host instead, and dependants wait on service_started.

  jaeger:
    profiles: [obs]
    image: jaegertracing/jaeger:2.10.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${JAEGER_UI_HOST_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.6.3
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/case-throughput.json
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mongo_data:
  rabbit_data:
  minio_data:
  prometheus_data:
  grafana_data:
