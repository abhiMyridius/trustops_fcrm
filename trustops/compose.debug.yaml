# Debug overlay: publishes the infrastructure and health ports to the host.
#
#   make up-debug    (= docker compose -f docker-compose.yaml -f compose.debug.yaml
#                       up -d --build)
#
# The default stack publishes exactly one port, the gateway's, so nothing
# bypasses its auth_request. Use this overlay when you need a host client on
# an infrastructure service (mongosh, the RabbitMQ management UI, the MinIO
# console, OPA's REST API) or the harness's health endpoint. Every port can be
# moved with its *_HOST_PORT variable and binds to ${BIND_ADDRESS:-127.0.0.1}.
#
# Host MongoDB clients need ?directConnection=true: the replica set
# advertises its member as mongo:27017, which the host cannot resolve.

services:
  mongo:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MONGO_HOST_PORT:-27017}:27017"
  rabbitmq:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"
  minio:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_HOST_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
  opa:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OPA_HOST_PORT:-8181}:8181"
  redis:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
  harness:
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HARNESS_HEALTH_HOST_PORT:-9100}:9100"
