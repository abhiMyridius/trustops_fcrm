# SonarQube scan settings for TrustOpsAI-FCRM (ADR-90). Scan from this folder.
# sonarqubescript.py leaves -Dsonar.sources/-Dsonar.exclusions out when this file exists,
# because a command-line flag would override what is set here.
sonar.sources=.
sonar.python.version=3.13

# Test code is declared as test code so production-only rules do not run on it.
# MSW mocks load only behind VITE_API_MODE=msw (src/frontend/src/main.tsx) and the web
# Dockerfile deletes the worker from the build, so they are test support too.
sonar.tests=tests,src/frontend/e2e,src/frontend/src/test,src/frontend/src/mocks
sonar.test.inclusions=tests/**,src/frontend/e2e/**,src/frontend/src/test/**,src/frontend/src/mocks/**

# A file cannot be both source and test; generated and vendored files are not ours to fix.
sonar.exclusions=tests/**,src/frontend/e2e/**,src/frontend/src/test/**,src/frontend/src/mocks/**,\
**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**,ops/reports/**,\
docs/architecture/openapi/**,src/backend/packages/seed/fcrm_seed/seed.json,\
src/frontend/public/mockServiceWorker.js

# Coverage (make coverage); the paths are relative to this folder.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info

# Rules suppressed on purpose. Each group says why; nothing here hides a defect.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17

# Contracts-first: `x: Optional[T]` with no default means "required but nullable". A default
# would change the OpenAPI contract and the event schemas.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S8396
sonar.issue.ignore.multicriteria.e1.resourceKey=src/backend/**

# `async` without `await` where an interface or the framework fixes the signature: the
# in-memory and static store classes, Starlette exception handlers, FastAPI dependencies,
# lifespan hooks and per-agent callables held in dispatch tables.
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e2.resourceKey=src/backend/**

# Keyword-only builder signatures, and a per-call timeout that is the shared HTTP client's API.
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S107
sonar.issue.ignore.multicriteria.e3.resourceKey=src/backend/**
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S7483
sonar.issue.ignore.multicriteria.e4.resourceKey=src/backend/**

# Upstream clones of AEO's engines (UPSTREAM.md): bugs, vulnerabilities, slow regexes and small
# idioms are fixed here; structural smells stay as upstream wrote them so the clone stays comparable.
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e5.resourceKey=src/backend/workers/*/evoq_*/**
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e6.resourceKey=src/backend/workers/*/evoq_*/**
sonar.issue.ignore.multicriteria.e7.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.e7.resourceKey=src/backend/workers/*/evoq_*/**
sonar.issue.ignore.multicriteria.e8.ruleKey=python:S3516
sonar.issue.ignore.multicriteria.e8.resourceKey=src/backend/workers/*/evoq_*/**
sonar.issue.ignore.multicriteria.e9.ruleKey=python:S8495
sonar.issue.ignore.multicriteria.e9.resourceKey=src/backend/workers/*/evoq_*/**

# False positives, one file each.
# uvicorn binds the container's health port; compose decides what is published.
sonar.issue.ignore.multicriteria.e10.ruleKey=python:S8392
sonar.issue.ignore.multicriteria.e10.resourceKey=src/backend/**/__main__.py
# get_unverified_header only reads alg/kid to pick the key; the verified decode follows.
sonar.issue.ignore.multicriteria.e11.ruleKey=python:S5659
sonar.issue.ignore.multicriteria.e11.resourceKey=src/backend/packages/common/fcrm_common/auth.py
# Jinja renders Markdown prompts, never HTML.
sonar.issue.ignore.multicriteria.e12.ruleKey=python:S5247
sonar.issue.ignore.multicriteria.e12.resourceKey=ai/_tools/validate_ai.py
# An async comprehension over an AsyncIterator, which S3862/S5864 cannot see through.
sonar.issue.ignore.multicriteria.e13.ruleKey=python:S3862
sonar.issue.ignore.multicriteria.e13.resourceKey=src/backend/packages/common/fcrm_common/mongo.py
# boto3's own keyword name (a presigned-url signature mirrors it).
sonar.issue.ignore.multicriteria.e14.ruleKey=python:S117
sonar.issue.ignore.multicriteria.e14.resourceKey=src/backend/packages/common/fcrm_common/objectstore.py

# CLI entry points print one line for an expected failure (a missing file, an unreachable
# stack); a traceback there is noise. Service code uses logger.exception.
sonar.issue.ignore.multicriteria.e15.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.e15.resourceKey=ai/_tools/**
sonar.issue.ignore.multicriteria.e16.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.e16.resourceKey=ops/scripts/**
sonar.issue.ignore.multicriteria.e17.ruleKey=python:S8572
sonar.issue.ignore.multicriteria.e17.resourceKey=src/backend/packages/seed/**
