# otel-collector (ADR-09, design A §11.5). Every container exports OTLP here
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318). Traces, metrics and
# logs all go to OpenObserve (ADR-66, ADR-68); traces also go to Jaeger and
# metrics are also exposed for Prometheus on :8889, which Grafana reads.
#
# Started with two --config files that the collector merges:
#   /etc/otelcol/collector.yaml        this file (every environment)
#   /etc/otelcol/env/${ENV}.yaml       per-environment overlay; only
#                                      env/local.yaml adds the debug exporter,
#                                      so console dumps never run outside
#                                      ENV=local.
# OpenObserve's address and login come from the environment that compose
# passes in, never from this file: OPENOBSERVE_OTLP_ENDPOINT (default: the
# bundled container, http://openobserve:5080/api/default), OPENOBSERVE_USER
# and OPENOBSERVE_PASSWORD (default: the ZO_ROOT_USER_* login the bundled
# container is created with) and OPENOBSERVE_STREAM (default: trustops). Set
# them in .env to send everything to your team's own OpenObserve instead.
# The AWS path swaps the exporters for awsxray / awsemf / awscloudwatchlogs
# behind an ADOT collector (ops/aws), with the same receivers and processors.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # The OpenObserve login, sent as HTTP basic auth on every export (the
  # extension builds the header from these two values). Read from the
  # environment so no credential lives in this file.
  basicauth/openobserve:
    client_auth:
      username: ${env:OPENOBSERVE_USER}
      password: ${env:OPENOBSERVE_PASSWORD}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    send_batch_size: 1024
    timeout: 2s

  resource:
    attributes:
      - key: deployment.environment
        value: ${env:ENV}
        action: upsert

  # Credentials never leave the process that received them. HTTP
  # instrumentation can capture request headers as span/log attributes; the
  # bearer token, cookies and the internal service-token header are deleted
  # here before any exporter sees them.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: http.request.header.x-internal-client
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metric names are exported exactly as fcrm_common.metrics names them
  # (fcrm_agent_tokens_total, fcrm_gate_wait_seconds, ...): no unit or _total
  # suffix is added, so the Grafana PromQL can rely on the documented names
  # (histograms still get _bucket/_sum/_count). Resource attributes
  # (service.name, component.id, deployment.environment) become labels.
  prometheus:
    endpoint: 0.0.0.0:8889
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 30m

  # Defined here, wired only by env/local.yaml.
  debug:
    verbosity: basic

  # OpenObserve (ADR-66, ADR-68): one exporter for all three signals. The
  # endpoint is the organisation path, and the exporter appends /v1/traces,
  # /v1/metrics or /v1/logs. Logs land in the OPENOBSERVE_STREAM stream, and
  # traces too where OpenObserve honours the header (else `default`); metrics
  # are stored per metric name, searchable at
  # http://localhost:5080 for the bundled container. The JSON each container
  # writes to stdout stays the log system of record (design A §10.7), and the
  # AWS path ships that to CloudWatch instead of using this exporter.
  otlphttp/openobserve:
    endpoint: ${env:OPENOBSERVE_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/openobserve
    headers:
      stream-name: ${env:OPENOBSERVE_STREAM}

service:
  extensions: [health_check, basicauth/openobserve]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [otlp/jaeger, otlphttp/openobserve]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [prometheus, otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [otlphttp/openobserve]
