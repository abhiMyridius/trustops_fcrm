# otel-collector (ADR-09, design A §11.5). Every container exports OTLP here
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318); traces go to
# Jaeger, metrics are exposed for Prometheus on :8889, logs go to OpenObserve
# (ADR-66).
#
# Started with two --config files that the collector merges:
#   /etc/otelcol/collector.yaml        this file (every environment)
#   /etc/otelcol/env/${ENV}.yaml       per-environment overlay; only
#                                      env/local.yaml adds the debug exporter,
#                                      so console dumps never run outside
#                                      ENV=local.
# The logs pipeline needs the ZO_ROOT_USER_EMAIL / ZO_ROOT_USER_PASSWORD login
# that compose passes in (the same one OpenObserve is created with).
# The AWS path swaps the exporters for awsxray / awsemf / awscloudwatchlogs
# behind an ADOT collector (ops/aws), with the same receivers and processors.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # The OpenObserve root login, sent as HTTP basic auth on every log export.
  # Read from the environment so no credential lives in this file.
  basicauth/openobserve:
    client_auth:
      username: ${env:ZO_ROOT_USER_EMAIL}
      password: ${env:ZO_ROOT_USER_PASSWORD}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    send_batch_size: 1024
    timeout: 2s

  resource:
    attributes:
      - key: deployment.environment
        value: ${env:ENV}
        action: upsert

  # Credentials never leave the process that received them. HTTP
  # instrumentation can capture request headers as span/log attributes; the
  # bearer token, cookies and the internal service-token header are deleted
  # here before any exporter sees them.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: http.request.header.x-internal-client
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metric names are exported exactly as fcrm_common.metrics names them
  # (fcrm_agent_tokens_total, fcrm_gate_wait_seconds, ...): no unit or _total
  # suffix is added, so the Grafana PromQL can rely on the documented names
  # (histograms still get _bucket/_sum/_count). Resource attributes
  # (service.name, component.id, deployment.environment) become labels.
  prometheus:
    endpoint: 0.0.0.0:8889
    add_metric_suffixes: false
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 30m

  # Defined here, wired only by env/local.yaml.
  debug:
    verbosity: basic

  # The log store (ADR-66). The api and harness export their logs over OTLP
  # whenever OTEL_EXPORTER_OTLP_ENDPOINT is set; OpenObserve keeps them in the
  # `trustops` stream, searchable at http://localhost:5080. The JSON each
  # container writes to stdout stays the system of record (design A §10.7), and
  # the AWS path ships that to CloudWatch instead of using this exporter. The
  # endpoint is the organisation path; the exporter appends /v1/logs.
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    auth:
      authenticator: basicauth/openobserve
    headers:
      stream-name: trustops

service:
  extensions: [health_check, basicauth/openobserve]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [otlphttp/openobserve]
