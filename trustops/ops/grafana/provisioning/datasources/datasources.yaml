# Grafana datasources (ADR-09). A fixed uid so the provisioned dashboards
# reference it without a lookup. Traces live in OpenObserve (ADR-68, ADR-71):
# a Prometheus exemplar's trace_id opens its trace there. The Jaeger datasource
# is deleted on provisioning, so a Grafana volume from before ADR-71 loses it.
apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Jaeger
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          # $$ keeps Grafana from reading ${__value.raw} as an environment variable.
          urlDisplayLabel: Trace in OpenObserve
          url: http://localhost:5080/web/traces?org_identifier=default&stream=trustops&trace_id=$${__value.raw}
