# Prometheus (ADR-09, design A §11.5). Application metrics arrive over OTLP
# at the collector and are scraped from its Prometheus exporter; services do
# not expose /metrics themselves.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: trustops

scrape_configs:
  # fcrm_* application metrics (fcrm_common.metrics) via the collector.
  # honor_labels keeps the service_name / component_id labels the collector
  # derives from OTel resource attributes.
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own health (accepted/refused spans, exporter queue).
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Broker-side queue depth, DLQ size and consumer counts
  # (rabbitmq_prometheus plugin, enabled in ops/rabbitmq/enabled_plugins);
  # works before any worker reports fcrm_queue_depth.
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
