# RabbitMQ node config for TrustOps (X3, ADR-02). Mounted into
# /etc/rabbitmq/conf.d/ next to the image's own 10-defaults.conf.
#
# Topology is imported at boot (exchanges, quorum work queues, retry
# queues, DLX/DLQs, the safety policy; see the _comment in definitions.json
# for the TTL + DLX retry mechanism). The file imported is the runtime copy
# ops/rabbitmq/entrypoint.sh writes at container start: the committed
# definitions.json plus the one user from RABBITMQ_DEFAULT_USER / _PASS
# (hashed), because RabbitMQ does not create the default user when
# definitions are imported at boot and no credential may be committed.
definitions.import_backend = local_filesystem
definitions.local.path = /run/fcrm-rabbitmq/definitions.json

# Quorum queues are the default for anything a client declares without a type.
default_queue_type = quorum

# Prometheus plugin (enabled_plugins): per-object queue metrics on :15692.
prometheus.return_per_object_metrics = false
