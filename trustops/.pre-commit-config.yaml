# The project lives in trustops/ inside the trustops_fcrm repo (ADR-25).
# pre-commit runs hooks from the git root, so entries carry the trustops/
# prefix, and the Python hooks' `files` keeps Documents/ and FCRM_v2/ out. No
# top-level `files`: it would also filter out .git/COMMIT_EDITMSG. The ruff hooks
# exclude the vendored evoq_* clones by pattern: ruff's own extend-exclude only
# applies when it runs from trustops/, and pre-commit runs it from the git root.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project trustops/src/backend ruff format
        language: system
        types: [python]
        files: ^trustops/
        exclude: ^trustops/src/backend/workers/(ingestion-worker/evoq_ingestion|context-worker/evoq_context)/
      - id: ruff-check
        name: ruff check
        entry: uv run --project trustops/src/backend ruff check --fix
        language: system
        types: [python]
        files: ^trustops/
        exclude: ^trustops/src/backend/workers/(ingestion-worker/evoq_ingestion|context-worker/evoq_context)/
      - id: mypy
        name: mypy (changed packages)
        entry: trustops/ops/scripts/mypy_changed.sh
        language: system
        types: [python]
        files: ^trustops/
        pass_filenames: false
      - id: pytest-unit
        name: pytest unit (changed packages)
        entry: trustops/ops/scripts/pytest_changed.sh
        language: system
        types: [python]
        files: ^trustops/
        pass_filenames: false
      - id: governance-append-only
        name: governance tables are append-only
        entry: trustops/ops/scripts/governance_append_only.py
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-msg-lint
        name: commit message references a decision
        entry: trustops/ops/scripts/commit_msg_lint.py
        language: system
        stages: [commit-msg]
