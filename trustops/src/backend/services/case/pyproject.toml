[project]
name = "fcrm-case-service"
version = "0.1.0"
description = "S1 case-service: cases, submission versions, fields, documents, review items, clarification threads, conditions, SSE. fcrm_case.domain is pure business logic with no I/O; fcrm_case.store/routes/lifespan/main add the HTTP layer and Mongo repositories on top of fcrm_common."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
  "fcrm-seed",
  "fcrm-common",
  "fcrm-guardrails",
  "fastapi>=0.115",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "mypy>=1.14", "hypothesis>=6.123", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_case"]
