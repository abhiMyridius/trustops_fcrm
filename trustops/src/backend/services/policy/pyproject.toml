[project]
name = "fcrm-policy-service"
version = "0.1.0"
description = "S3 policy-service: corpus, clauses, controls, jurisdictions, field sets, precedents, hybrid search over S3 Vectors + Mongo text. fcrm_policy.search.rrf and fcrm_policy.search.filters are pure; fcrm_policy.search.service orchestrates them against Mongo keyword search and H4's context-worker engine (imported directly as a library -- see fcrm_policy/search/vector.py's module docstring for why)."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
  "fcrm-common",
  "fcrm-seed",
  "fcrm-scoring-service",
  "fcrm-context-worker",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "mypy>=1.14", "hypothesis>=6.123", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_policy"]
