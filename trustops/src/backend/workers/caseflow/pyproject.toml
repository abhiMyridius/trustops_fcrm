[project]
name = "fcrm-caseflow"
version = "0.1.0"
description = "H1 Caseflow: the case-lifecycle state machine. Original code, no workflow framework (D-10). It never reasons — it dispatches jobs, opens gates, calls fcrm_scoring, and records what happened. fcrm_caseflow.states and .transitions are pure and have no I/O."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
  "fcrm-common",
  "fcrm-guardrails",
  "faststream[rabbit]==0.6.7",
  "uvicorn[standard]>=0.34",
]
# The pure fcrm_caseflow.states/.transitions/.triggers/.routing/.eventstore
# modules still have zero I/O dependencies; fcrm-common (Mongo/outbox/
# events), fcrm-guardrails (human_gate) and FastStream are only imported by
# the real runtime added alongside them (store.py, gates.py, engine.py,
# consumers.py, app.py).

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "mypy>=1.14", "hypothesis>=6.123"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_caseflow"]
