[project]
name = "fcrm-harness"
version = "0.1.0"
description = "The composite harness process: H1 caseflow, H2 agent-worker, H3 ingestion-worker and H4 context-worker as units on one FastStream broker, one Mongo client and one health endpoint (ADR-26)."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
  "fcrm-common",
  "fcrm-caseflow",
  "fcrm-agent-worker",
  "fcrm-ingestion-worker",
  "fcrm-context-worker",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_harness"]
