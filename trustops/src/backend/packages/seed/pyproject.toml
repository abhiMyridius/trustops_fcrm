[project]
name = "fcrm-seed"
version = "0.1.0"
description = "P7: the single generated dataset every service, test and eval reads (ADR-16). seed.json is produced by gen_seed.py from the approved walkthrough-v2 seed; this package also loads it into Mongo on first boot."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
# `gen` is the generation-time tooling (gen_docs.py renders the demo PDFs). It
# is its own group so a runtime image never carries reportlab; dev includes it
# because the unit tests re-run the generator to prove it is deterministic.
gen = ["reportlab>=4.0"]
dev = ["pytest>=8.3", "mypy>=1.14", { include-group = "gen" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_seed"]

[tool.hatch.build.targets.wheel.force-include]
"fcrm_seed/seed.json" = "fcrm_seed/seed.json"
