[project]
name = "fcrm-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts: API models, event envelope/payloads, proposal schemas, enums. Every other unit imports from here; nothing redefines a shape."
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9",
  "python-ulid>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_contracts"]
