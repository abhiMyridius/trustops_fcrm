[project]
name = "fcrm-audit-service"
version = "0.1.0"
description = "S4 audit-service: the evidence ledger (proposals) and the hash-chained, append-only audit_records. fcrm_audit.chain is pure and has no I/O; it is the only place a chain hash is ever computed (design A §2.4)."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
  "fcrm-common",
  "fcrm-seed",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]
# fcrm-seed is a hard dependency now (not test-only): the live service seeds
# the demo case's 67-record chain on an empty collection at startup
# (lifespan.py, load_if_empty) and replays it for the chain-verify self-test.

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "mypy>=1.14", "hypothesis>=6.123", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_audit"]
