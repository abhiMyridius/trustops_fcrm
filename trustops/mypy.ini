[mypy]
python_version = 3.13
mypy_path = src/backend
namespace_packages = True
explicit_package_bases = True
disallow_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True

; mypy --strict per ADR-21 / design A §1.2 on the packages where correctness
; matters most this week; the rest still gets disallow_untyped_defs.
[mypy-fcrm_scoring.*]
strict = True
[mypy-fcrm_contracts.*]
strict = True
[mypy-fcrm_guardrails.*]
strict = True
[mypy-fcrm_caseflow.*]
strict = True
[mypy-fcrm_common.*]
strict = True
[mypy-fcrm_api.*]
strict = True
[mypy-fcrm_harness.*]
strict = True
[mypy-evoq_ingestion.*]
strict = True
[mypy-evoq_context.*]
strict = True
[mypy-fcrm_agents.*]
strict = True
[mypy-fcrm_tools.*]
strict = True
[mypy-fcrm_prompts.*]
strict = True

; third-party libs without bundled stubs
[mypy-faststream.*]
ignore_missing_imports = True
[mypy-pydantic_ai.*]
ignore_missing_imports = True
[mypy-presidio_analyzer.*]
ignore_missing_imports = True
; boto3/botocore ship no stubs or py.typed marker, and reportlab is the
; generation-time PDF renderer. Scoped to the modules that import them, not
; global, so the cloned evoq_context's own `type: ignore` on botocore stays used.
[mypy-fcrm_common.objectstore]
disable_error_code = import-untyped
[mypy-fcrm_seed.docs_layout]
disable_error_code = import-untyped
; fcrm_evals.judge reaches botocore only for its exception types and the
; region lookup; it ships no stubs (as for boto3 above).
[mypy-fcrm_evals.judge.llm]
disable_error_code = import-untyped
