# Test override for `make e2e` and `make test-int`:
#
#   docker compose -p trustops-test \
#     -f docker-compose.yaml -f compose.obs.yaml -f compose.test.yaml up -d
#
# Agents call live Bedrock (ADR-27: there is no replay mode), so the harness
# keeps the operator's AWS credentials. The api process (X1 + S1-S5) runs with
# ENV=test, an in-memory vector index with the deterministic dummy embedding
# provider, an always-seeded database, and its AWS keys blanked: nothing in it
# calls Bedrock, so a stray call fails instead of spending. The Makefile runs
# this under its own project name (trustops-test) so its volumes never touch
# the dev stack's, tears it down with -v afterwards, and moves the host ports
# by +1000.

x-test-modes: &test-modes
  ENV: test
  VECTOR_BACKEND: memory
  EMBEDDING_PROVIDER: dummy
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_SESSION_TOKEN: ""
  SEED_ON_EMPTY: "true"

services:
  # api (X1 + S1–S5) takes the in-memory vector index and dummy embeddings
  # for S3, ENV=test and an always-seeded database.
  api:
    environment:
      <<: *test-modes

  # The harness only needs ENV=test (log/trace labels, otel overlay).
  harness:
    environment:
      ENV: test

  otel-collector:
    command:
      - --config=/etc/otelcol/collector.yaml
      - --config=/etc/otelcol/env/test.yaml
    environment:
      ENV: test
