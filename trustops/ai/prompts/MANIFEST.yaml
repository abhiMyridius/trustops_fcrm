# ai/prompts/MANIFEST.yaml
#
# set_version is the prompt set a case pins as `prompts_v` (PinnedVersions).
# It changes whenever any `current` pointer moves: ISO date, plus ".n" for
# the n-th bump on one day. Running cases keep their pinned set; new cases
# get the current one (design B §1.5, §6.4).
#
# Moving a `current` pointer requires a PASS eval result for the new version
# (evals/runners/gate.py) recorded as `eval_run` in that file's changelog;
# v1 is exempt (no baseline exists yet).
#
# History of set versions is append-only: add a row, never edit one, so any
# pinned prompts_v can be resolved to exact files.

set_version: "2026-10-19"

current:
  screening.system: 3
  screening.user: 1
  intake.system: 2
  intake.user: 1
  research.system: 3
  research.user: 1
  assessment.system: 2
  assessment.user: 1
  critic.system: 2
  critic.user: 1
  narrative.system: 2
  narrative.completeness.user: 1
  narrative.recommendation.user: 1
  examiner.system: 2
  examiner.user: 1
  watchlist.system: 2
  watchlist.user: 1
  policy_gap.system: 2
  policy_gap.user: 1
  narrative.judge: 1
  narrative.reduce: 1

# prompt id -> file, relative to ai/prompts (the loader also derives this
# from <agent>/<id>.v<N>.md; listed here so the mapping is reviewable)
files:
  screening.system: screening/screening.system.v{N}.md
  screening.user: screening/screening.user.v{N}.md
  intake.system: intake/intake.system.v{N}.md
  intake.user: intake/intake.user.v{N}.md
  research.system: research/research.system.v{N}.md
  research.user: research/research.user.v{N}.md
  assessment.system: assessment/assessment.system.v{N}.md
  assessment.user: assessment/assessment.user.v{N}.md
  critic.system: critic/critic.system.v{N}.md
  critic.user: critic/critic.user.v{N}.md
  narrative.system: narrative/narrative.system.v{N}.md
  narrative.completeness.user: narrative/narrative.completeness.user.v{N}.md
  narrative.recommendation.user: narrative/narrative.recommendation.user.v{N}.md
  examiner.system: examiner/examiner.system.v{N}.md
  examiner.user: examiner/examiner.user.v{N}.md
  watchlist.system: watchlist/watchlist.system.v{N}.md
  watchlist.user: watchlist/watchlist.user.v{N}.md
  policy_gap.system: policy_gap/policy_gap.system.v{N}.md
  policy_gap.user: policy_gap/policy_gap.user.v{N}.md
  narrative.judge: narrative/narrative.judge.v{N}.md
  narrative.reduce: narrative/narrative.reduce.v{N}.md

history:
  - set_version: "2026-10-03.1"
    date: 2026-10-03
    reason: first real prompt set (v1 of every prompt id); replaces the BA prototype's scripted prompts, which the seed records as prompts_v 2026-09-28
    pointers: {all: 1}
    eval_run: null
  - set_version: "2026-10-05"
    date: 2026-10-05
    reason: adds the rubric judge prompt narrative.judge v1 behind the narrative_faithfulness eval metric (fcrm_evals.judge); it runs on the judge tier and is used by evals only, so no agent prompt moved
    pointers: {narrative.judge: 1}
    eval_run: null
  - set_version: "2026-10-06"
    date: 2026-10-06
    reason: "second system prompt set, written from the first live eval run (evals/results/2026-10-05/): every agent prompt is aligned to its output contract, names the citation handle of each source kind, says the pack is complete so a tool call is the exception, and no longer pastes the output schema the output tool already sends; skills cite_verbatim, declare_gap and compare_precedent move to v2"
    pointers: {screening.system: 2, intake.system: 2, research.system: 2, assessment.system: 2, critic.system: 2, narrative.system: 2, examiner.system: 2, watchlist.system: 2, policy_gap.system: 2}
    eval_run: null
  - set_version: "2026-10-06.1"
    date: 2026-10-06
    reason: "screening.system v3, from the full 100-row screening run on v2 (fast_lane_precision 0.58, recall 0.39 against the R4 predicate): the prompt states R4 as the two cases the routing code accepts, reads the change types and the volume (F05) itself because nothing applies them to the agent's answer, and lets a described new corridor, segment or product veto both"
    pointers: {screening.system: 3}
    eval_run: null
  - set_version: "2026-10-06.2"
    date: 2026-10-06
    reason: "research.system v3: a clause proposal's clause_id and its source_ref name the same clause (a demo-case run spent its retry on a mismatch)"
    pointers: {research.system: 3}
    eval_run: null
  - set_version: "2026-10-19"
    date: 2026-10-19
    reason: "adds narrative.reduce v1, the cheap-tier call that merges the partial recommendation answers of a job whose input was split into parts (ADR-77, ADR-78); no agent prompt moved, and the prompt runs only when a recommendation job is split"
    pointers: {narrative.reduce: 1}
    eval_run: null
