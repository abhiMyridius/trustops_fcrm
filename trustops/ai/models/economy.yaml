# The economy profile (`make economy-profile`, ADR-56, ADR-60): the model it adds
# to the shipped tiers.yaml and the chains it sets, named by label. The running
# system never reads this file; ops/scripts/economy_profile.py does, to write the
# copy of ai/ that live checks use. A tier not listed under `chains` keeps its
# shipped chain (cheap: Haiku 4.5, then Nova Lite).
#
# Sonnet 4.5 is the one Sonnet the operator allowed for live checks (6 Oct 2026);
# Opus and the Sonnet 5 family are refused by the builder. A retry runs on the
# second model alone (ADR-14), so research and assessment retry on Sonnet 4.5
# itself: Haiku and Nova both failed those two agents' schemas on a retry.
models:
  us.anthropic.claude-sonnet-4-5-20250929-v1:0:
    family: anthropic
    label: "Sonnet 4.5"
    temperature: 0
    forced_tool_choice: allowed
    thinking: off_by_default
    prompt_cache: true

# Price rows added to tiers.yaml's prices_usd_per_mtok.rows. NOT VERIFIED against
# the AWS Price List: a report that uses this row says "unverified for: Sonnet 4.5".
prices:
  us.anthropic.claude-sonnet-4-5-20250929-v1:0:
    input: 3.3
    output: 16.5
    cache_read: 0.33
    cache_write: 4.125
    status: unverified
    retrieved_on: "2026-10-06"
    source: >-
      Estimate, not read from AWS: the vendor's list price (3 and 15 USD per Mtok;
      cache read 0.1x and a 5-minute cache write 1.25x of input) times 1.10, the
      factor between the vendor's rate and the Regional rate in every Anthropic row
      of the shipped table. Check against the AWS Price List before trusting a
      dollar figure.

chains:
  mid: ["Sonnet 4.5", "Haiku 4.5"]
  strong: ["Sonnet 4.5", "Sonnet 4.5"]
  judge: ["Nova Pro", "Haiku 4.5"]
