# ai/models/tiers.yaml
#
# The ONLY file in the repository that names a model id (ADR-03, ADR-04).
# Every other file refers to a tier name: cheap | mid | strong | judge.
# A lock test (tests/registry/test_locks.py::test_no_model_ids_outside_tiers)
# greps /ai, /src, /evals and /ops for model-id shapes and fails on any hit
# outside this file.
#
# Ids are Amazon Bedrock inference-profile ids verified against the account
# on 3 Oct 2026 (docs/requirements/research/07-runtime-facts.md). Do not edit
# an id without re-verifying it with boto3 `list_inference_profiles` and
# adding a decision-log row.

schema_version: 1
provider: bedrock
region: ${AWS_REGION}            # resolved from the environment by the loader; us-east-1 in the demo account
verified_on: "2026-10-03"
sdk:
  pydantic_ai: "2.53.0"          # pydantic-ai-slim[bedrock]; BedrockConverseModel + FallbackModel
  boto3: "1.39.11"
model_string_prefix: "bedrock:"  # Pydantic AI model string form is "bedrock:<id>"

embeddings:
  model: amazon.titan-embed-text-v2:0
  dims: 1024
  normalize: true
  invocation: on_demand
  used_by: [H4 context-worker, S3 policy-service]

# Fallback order is the FallbackModel order on attempt 1 (transport, 4xx and
# 5xx errors move down the list). Attempt 2 (after a Guard 4 rejection or a
# timeout) runs fallbacks[0] alone with the validation error appended
# (ADR-14). Exactly one retry per run (BUILD-PLAN §3.4).
#
# `budget` is copied into every agent spec; a unit test asserts the copy equals
# the tier and Guard 3's table (tests/unit/packages/agents/test_budgets_agree.py).
# `max_tokens`, `wall_clock_s` and `retries` repeat the budget fields in the
# flat form the runtime reads. Raising any of them needs a decision-log row.
#
# `budget.tokens` is what ONE ATTEMPT may spend, every request of it included
# (a tool round trip re-sends the whole request). It is set from measured usage,
# about 30% over the p90 of an attempt (evals/README.md, "Budgets from measured
# usage"), not from the first design's estimate (cheap 6k, mid 12k, strong 20k,
# judge 20k), which the first live run showed no real run could hold:
#   cheap  15k  real demo windows of intake: 6-12k an attempt, p90 11.5k
#   mid    11k  narrative, examiner, policy_gap: 5-8.5k, p90 8.5k
#   strong 26k  research and assessment with one tool round trip: p90 about 20k
#   judge  17.5k critic: 8-13k, p90 13.4k
# A run that would need more is blocked on its budget (agent.failed, the handoff
# gate), never silently cut. `max_tokens` is the cap on ONE REQUEST's output,
# thinking included; it was 2000/3500/5000/4000 and cut a critic, an assessment
# and an intake window off mid-answer (a cut tool call arrives as {}).
tiers:
  cheap:
    primary: us.anthropic.claude-haiku-4-5-20251001-v1:0
    fallbacks:
      - us.amazon.nova-lite-v1:0
    max_tokens: 4000               # output cap per request (was 2000: an intake window of 15 values is cut off at 2000, and a cut tool call arrives as {})
    wall_clock_s: 60
    retries: 1
    budget: {tokens: 15000, wall_s: 60, retries: 1}
    cache_min_prefix_tokens: 4096  # Haiku-class minimum; cheap system prompts stay below it, so no cache point is emitted
    used_by: [screening, intake, watchlist]
  mid:
    primary: us.anthropic.claude-sonnet-5-5
    fallbacks:
      - us.anthropic.claude-haiku-4-5-20251001-v1:0
    effort: low                    # output_config.effort for the chain's thinking models; see the models block
    max_tokens: 4000
    wall_clock_s: 120
    retries: 1
    budget: {tokens: 11000, wall_s: 120, retries: 1}
    cache_min_prefix_tokens: 1024
    used_by: [narrative, examiner, policy_gap]
  strong:
    primary: us.anthropic.claude-sonnet-5-5
    fallbacks:
      - us.anthropic.claude-opus-5-5
      - us.amazon.nova-pro-v1:0
    effort: medium
    max_tokens: 8000
    wall_clock_s: 180
    retries: 1
    budget: {tokens: 26000, wall_s: 180, retries: 1}
    cache_min_prefix_tokens: 1024
    used_by: [research, assessment]
  judge:
    # Runs on a different model than the assessor it checks (ADR-04): the
    # strong tier's primary is Sonnet, so the critic's primary is Opus.
    primary: us.anthropic.claude-opus-5-5
    fallbacks:
      - us.anthropic.claude-sonnet-5-5
    effort: medium
    max_tokens: 8000
    wall_clock_s: 180
    retries: 1
    budget: {tokens: 17500, wall_s: 180, retries: 1}
    cache_min_prefix_tokens: 1024
    used_by: [critic, eval judges]

per_case_budget_tokens: 120000

# Request constraints per model, read by the fcrm_agents runtime when it
# builds ModelSettings. Taken from the Claude API reference (Sept 2026); the
# Bedrock Converse surface is expected to behave the same, and the agents lane
# confirms with one live call per model before relying on it.
#  - temperature: Sonnet 5.5 rejects non-default sampling values and Opus 5.5
#    rejects sampling parameters entirely, so the runtime OMITS temperature
#    for those ids (there is no replay mode, ADR-27).
#  - forced_tool_choice: Sonnet 5.5 and Opus 5.5 reject tool_choice any/tool.
#    If Pydantic AI's ToolOutput forces the output tool, use tool_choice auto
#    plus the prompt's "output exactly one object" line (or PromptedOutput)
#    and let Guard 4 reject a missing output.
#  - thinking: neither model can switch thinking off; it is adaptive, and its
#    tokens come out of max_tokens. Measured live on Bedrock (6 Oct 2026, a
#    forced-style tool call with max_tokens 2000): at the default effort Sonnet
#    5.5 spent 795 output tokens and Opus 5.5 1134, both with a reasoning block;
#    with output_config.effort low, 594 and 497, none. Bedrock accepts the
#    field on both (additionalModelRequestFields); it rejects thinking
#    between_tools on Opus and thinking disabled on both.
#  - effort_param: the model takes output_config.effort. The runtime sends it,
#    at the tier's `effort`, to that model only (fcrm_agents.models.model_defaults);
#    Bedrock rejects the field on Haiku and Nova, so it is never chain-wide.
#  - prompt_cache: the model takes a cachePoint after the system prompt and after
#    the tool definitions (probed live, 6 Oct 2026: Haiku 4.5, Sonnet 5.5 and
#    Opus 5.5 accept both; the Nova models reject one in the tool list). A prefix
#    under the model's minimum is not cached and is not an error (Haiku wrote
#    nothing at about 1k tokens, Sonnet and Opus cached 856).
#  - label: the name a report may print for the model. Committed result files
#    live under /evals, where no model id may appear (ADR-04), so the evals
#    report every model by this label (fcrm_evals.usage.PriceTable.label).
models:
  us.anthropic.claude-haiku-4-5-20251001-v1:0:
    family: anthropic
    label: "Haiku 4.5"
    temperature: 0
    forced_tool_choice: allowed
    thinking: off_by_default
    prompt_cache: true
  us.anthropic.claude-sonnet-5-5:
    family: anthropic
    label: "Sonnet 5.5"
    temperature: omit
    forced_tool_choice: rejected
    thinking: adaptive_always
    effort_param: true
    prompt_cache: true
  us.anthropic.claude-opus-5-5:
    family: anthropic
    label: "Opus 5.5"
    temperature: omit
    forced_tool_choice: rejected
    thinking: adaptive_always
    effort_default: medium
    effort_param: true
    prompt_cache: true
  us.amazon.nova-lite-v1:0:
    family: amazon
    label: "Nova Lite"
    temperature: 0
    forced_tool_choice: unverified
    thinking: none
  us.amazon.nova-pro-v1:0:
    family: amazon
    label: "Nova Pro"
    temperature: 0
    forced_tool_choice: unverified
    thinking: none

# USD per 1M tokens, used only for ModelCallRecord.cost_usd and the token
# report. AWS sets Bedrock prices for partner models and they can differ from
# the vendor's own list price.
#  - Anthropic rows are the Anthropic first-party list rates (Claude API, Sept
#    2026): Haiku 4.5 $1/$5, Sonnet 5.5 $2/$10, Opus 5.5 $4/$20; cache read =
#    0.1x input (Sonnet 5.5 and Opus 5.5 list $0.20), 5-minute cache write =
#    1.25x input. They stand in for Bedrock pricing (placeholder: confirm
#    against the AWS Bedrock pricing page before go-live).
#  - Nova and Titan rows are the public Bedrock on-demand rates last
#    published (placeholder: confirm against the AWS Bedrock pricing page
#    before go-live). No cache pricing is recorded for Nova.
# Reconcile against the AWS bill weekly (07-runtime-facts.md).
prices_usd_per_mtok:
  currency: USD
  status: placeholder_confirm_before_go_live
  rows:
    us.anthropic.claude-haiku-4-5-20251001-v1:0: {input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25}
    us.anthropic.claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
    us.anthropic.claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
    us.amazon.nova-lite-v1:0: {input: 0.06, output: 0.24, cache_read: null, cache_write: null}
    us.amazon.nova-pro-v1:0: {input: 0.80, output: 3.20, cache_read: null, cache_write: null}
    amazon.titan-embed-text-v2:0: {input: 0.02, output: null, cache_read: null, cache_write: null}
