# ai/models/tiers.yaml
#
# The ONLY file in the repository that names a model id (ADR-03, ADR-04).
# Every other file refers to a tier name: cheap | mid | strong | judge.
# A lock test (tests/registry/test_locks.py::test_no_model_ids_outside_tiers)
# greps /ai, /src, /evals and /ops for model-id shapes and fails on any hit
# outside this file.
#
# Ids are Amazon Bedrock inference-profile ids verified against the account
# on 3 Oct 2026 (docs/requirements/research/07-runtime-facts.md). Do not edit
# an id without re-verifying it with boto3 `list_inference_profiles` and
# adding a decision-log row.

schema_version: 1
provider: bedrock
region: ${AWS_REGION}            # resolved from the environment by the loader; us-east-1 in the demo account
verified_on: "2026-10-03"
sdk:
  pydantic_ai: "2.53.0"          # pydantic-ai-slim[bedrock]; BedrockConverseModel + FallbackModel
  boto3: "1.39.11"
model_string_prefix: "bedrock:"  # Pydantic AI model string form is "bedrock:<id>"

embeddings:
  model: amazon.titan-embed-text-v2:0
  label: "Titan Text Embeddings V2"   # the name a report prints (fcrm_evals.usage.PriceTable.label)
  dims: 1024
  normalize: true
  invocation: on_demand
  used_by: [H4 context-worker, S3 policy-service]

# Fallback order is the FallbackModel order on attempt 1 (transport, 4xx and
# 5xx errors move down the list). Attempt 2 (after a Guard 4 rejection or a
# timeout) runs fallbacks[0] alone with the validation error appended
# (ADR-14). Exactly one retry per run (BUILD-PLAN §3.4).
#
# `budget` is copied into every agent spec; a unit test asserts the copy equals
# the tier and Guard 3's table (tests/unit/packages/agents/test_budgets_agree.py).
# `max_tokens`, `wall_clock_s` and `retries` repeat the budget fields in the
# flat form the runtime reads. Raising any of them needs a decision-log row.
#
# `budget.tokens` is what ONE ATTEMPT may spend, every request of it included
# (a tool round trip re-sends the whole request). It is set from measured usage,
# about 30% over the p90 of an attempt (evals/README.md, "Budgets from measured
# usage"), not from the first design's estimate (cheap 6k, mid 12k, strong 20k,
# judge 20k), which the first live run showed no real run could hold:
#   cheap  15k  real demo windows of intake: 6-12k an attempt, p90 11.5k
#   mid    15k  narrative, examiner, policy_gap: 5-8.5k, p90 8.5k on the eval sample; the live
#               demo case's narrative is 8k clean and 13k on its retried attempt (the pack plus
#               Guard 4's reasons plus its first answer), which blocked it at 11k (first full live run)
#   strong 56k  research and assessment, effort low, one tool round trip: p90 18k on the eval
#               sample, but 39.8k on a live case (19 Oct, FCRM-2026-0153: a policy search
#               returned ~15k of clause text), which 24k blocked; 56k plus the 8k output cap
#               is a 64k attempt limit (ADR-81)
#   judge  28k  critic: on Opus (until 7 Oct) 5-7k an attempt, 11-12k with a tool round trip on
#               the eval sample, 16.4k on the live demo case (16 controls: the pack and the one
#               tool round trip re-sent). On Nova Pro the critic used 21.9k on a live run and was
#               blocked at 20k (6 Oct, D-95), so the tier is 28k, about 28% over that one
#               measurement; it is a single observation, not a p90 (ADR-62)
#
# `effort` (output_config.effort) is set on a tier only when a model of its chain takes
# it (`effort_param` below): mid and strong run Sonnet 5.5, which does, so both say low;
# cheap and judge hold no such model and set nothing. Measured on Sonnet 5.5 and Opus 5.5,
# low against medium cut the critic from 8-14k tokens an attempt to 5-7k and moved no
# gate metric (evals/README.md).
# A run that would need more is blocked on its budget (agent.failed, the handoff
# gate), never silently cut. `max_tokens` is the cap on ONE REQUEST's output,
# thinking included; it was 2000/3500/5000/4000 and cut a critic, an assessment
# and an intake window off mid-answer (a cut tool call arrives as {}).
tiers:
  cheap:
    primary: us.anthropic.claude-haiku-4-5-20251001-v1:0
    fallbacks:
      - us.amazon.nova-lite-v1:0
    max_tokens: 4000               # output cap per request (was 2000: an intake window of 15 values is cut off at 2000, and a cut tool call arrives as {})
    wall_clock_s: 60
    retries: 1
    budget: {tokens: 15000, wall_s: 60, retries: 1}
    cache_min_prefix_tokens: 4096  # Haiku-class minimum; cheap system prompts stay below it, so no cache point is emitted
    used_by: [screening, intake, watchlist]
  mid:
    primary: us.anthropic.claude-sonnet-5-5
    fallbacks:
      - us.anthropic.claude-haiku-4-5-20251001-v1:0
    effort: low                    # output_config.effort for the chain's models that take it (Sonnet 5.5); see the models block
    max_tokens: 4000
    wall_clock_s: 120
    retries: 1
    budget: {tokens: 15000, wall_s: 120, retries: 1}
    cache_min_prefix_tokens: 1024
    used_by: [narrative, examiner, policy_gap]
  strong:
    primary: us.anthropic.claude-sonnet-5-5
    fallbacks:
      # A retry runs on fallbacks[0] alone (ADR-14): research and assessment retry
      # on Sonnet 5.5 itself, because a Guard 4 retry on Haiku or Nova failed both
      # agents' schemas in the live runs of 6 Oct (D-95). Nova Pro is the last resort.
      - us.anthropic.claude-sonnet-5-5
      - us.amazon.nova-pro-v1:0
    effort: low
    max_tokens: 8000
    wall_clock_s: 180
    retries: 1
    budget: {tokens: 56000, wall_s: 180, retries: 1}
    cache_min_prefix_tokens: 1024
    used_by: [research, assessment]
  judge:
    # Runs on a different model than the assessor it checks (ADR-04): the strong
    # tier's primary is Sonnet 5.5, so the critic's primary is Nova Pro, a different
    # family. No Opus anywhere (ADR-62, ADR-65).
    primary: us.amazon.nova-pro-v1:0
    fallbacks:
      - us.anthropic.claude-haiku-4-5-20251001-v1:0
    max_tokens: 8000
    wall_clock_s: 180
    retries: 1
    budget: {tokens: 28000, wall_s: 180, retries: 1}
    cache_min_prefix_tokens: 1024
    used_by: [critic, eval judges]

# The ENFORCED cap on every agent job of one case, across all of them (H1's
# per-case ledger, fcrm_caseflow.budget: one attempt of a job's tier is reserved
# before the job is published, the real usage is settled when it answers, and a
# dispatch that would pass the cap opens the human handoff instead). 250000 since
# 19 Oct (ADR-81): the strong tier's 56k reservation, twice for the research and
# assessment pair and again for their re-run, must fit. 160000 was the
# worst case measured on the live demo case: 115k with every job answering on its
# first attempt, 126k to 158k when Guard 4 forces a retry (evals/README.md, "The
# demo case against the 120k per-case cap"), plus a small margin, so a run that
# needs one retry completes and a case that needs two stops for the analyst.
per_case_budget_tokens: 250000
# The efficiency TARGET: what a clean run fits in. The harness monitor reports
# tokens_used against both numbers; a case over the target and under the cap is
# not an error.
per_case_target_tokens: 120000

# Request constraints per model, read by the fcrm_agents runtime when it
# builds ModelSettings. Taken from the Claude API reference (Sept 2026) and probed
# on Bedrock (6 Oct 2026).
#  - temperature: a number is sent as the sampling temperature; `omit` sends none,
#    for a model that rejects sampling parameters (Sonnet 5.5).
#  - forced_tool_choice: `allowed` models accept tool_choice any/tool; a `rejected`
#    model does not (the runtime then uses tool_choice auto plus the prompt's
#    "output exactly one object" line and lets Guard 4 reject a missing output);
#    `unverified` has not been probed (the Nova models).
#  - thinking: off_by_default (Haiku 4.5 reasons only when asked), none (Nova), or
#    adaptive_always (a model that cannot switch it off; its tokens come out of
#    max_tokens; Sonnet 5.5 is one). Measured live on Bedrock (6 Oct 2026, a
#    forced-style tool call with max_tokens 2000): at the default effort Sonnet
#    5.5 spent 795 output tokens with a reasoning block; with effort low, 594 and none.
#  - effort_param: the model takes output_config.effort. The runtime sends it, at
#    the tier's `effort`, to that model only (fcrm_agents.models.model_defaults);
#    Bedrock rejects the field on Haiku and Nova, so it is never chain-wide.
#  - prompt_cache: the model takes a cachePoint after the system prompt and after
#    the tool definitions (probed live, 6 Oct 2026: Haiku 4.5 and Sonnet 5.5 accept
#    both; the Nova models reject one in the tool list). A prefix under the
#    model's minimum is not cached and is not an error.
#  - label: the name a report may print for the model. Committed result files
#    live under /evals, where no model id may appear (ADR-04), so the evals
#    report every model by this label (fcrm_evals.usage.PriceTable.label).
# Sonnet 5.5 is the Sonnet in the chains (ADR-65, which supersedes the Sonnet 4.5 choice
# of ADR-62; Opus stays out). The prompts, the budgets and the last complete 21-scene
# pass were measured on it. Its id was verified on 3 Oct and has answered every agent run.
models:
  us.anthropic.claude-haiku-4-5-20251001-v1:0:
    family: anthropic
    label: "Haiku 4.5"
    temperature: 0
    forced_tool_choice: allowed
    thinking: off_by_default
    prompt_cache: true
  us.anthropic.claude-sonnet-5-5:
    family: anthropic
    label: "Sonnet 5.5"
    temperature: omit
    forced_tool_choice: rejected
    thinking: adaptive_always
    effort_param: true
    prompt_cache: true
  us.amazon.nova-lite-v1:0:
    family: amazon
    label: "Nova Lite"
    temperature: 0
    forced_tool_choice: unverified
    thinking: none
  us.amazon.nova-pro-v1:0:
    family: amazon
    label: "Nova Pro"
    temperature: 0
    forced_tool_choice: unverified
    thinking: none

# USD per 1M tokens, on-demand standard tier, used only for the cost estimate
# (ModelCallRecord.cost_usd, the eval RunUsage and dashboard, the token reports).
# AWS sets Bedrock prices for partner models; they differ from the vendor's own
# list price.
#
# VERIFIED on 6 Oct 2026 from the AWS Price List API (`aws pricing get-products`,
# region us-east-1, list versions 20260930001912 for the Claude models and
# 20261005210410 for Nova and Titan). Every row carries its own `status`,
# `source` and `retrieved_on`; a report prints "verified" only when every row is.
#  - Rate card: the ids above are `us.` GEOGRAPHIC cross-Region inference
#    profiles. AWS bills those at the standard (Regional) rate; a `global.`
#    profile is about 10% cheaper and is not used (Amazon Bedrock User Guide,
#    "Route model inference requests across AWS Regions": Cost, Geographic
#    "Standard pricing", Global "Approximately 10% savings"; Anthropic's pricing
#    page: "Regional and multi-region endpoints include a 10% premium over
#    global endpoints"). For Haiku 4.5 and Sonnet 5.5 every Regional row of the
#    Price List is exactly 1.10x its Global row, and the Global row is Anthropic's
#    list price, so the Anthropic rows below are the list price x 1.10.
#  - cache_write is the 5-minute write, which a cachePoint without a ttl uses;
#    1-hour writes (2x the Global input price) are not used.
#  - Nova: input and output are the on-demand rows, cache_read the cached-input
#    row, cache_write 0.00 (AWS lists the cache write at no charge). The Price
#    List has one Nova rate for in-Region and the US geographic profile.
#  - Titan Text Embeddings V2: the on-demand input row. Output and cache are
#    null: it returns a vector, and it has no cache.
#  - Batch, flex, priority, provisioned-throughput and custom-model rows are not
#    used by this stack and are not recorded.
# `status` is verified | unverified. An unverified row keeps its earlier figure
# and carries a `reason`; a model with no price row is a test failure. The
# table's own `status` rolls the rows up: verified, partly_verified or
# unverified (tests/unit/packages/evals/test_price_table_verified.py).
# Reconcile against the AWS bill weekly (07-runtime-facts.md).
prices_usd_per_mtok:
  currency: USD
  status: verified
  region: us-east-1
  rate_card: Regional (geographic cross-Region), on-demand standard
  retrieved_on: "2026-10-06"
  rows:
    us.anthropic.claude-haiku-4-5-20251001-v1:0:
      input: 1.10
      output: 5.50
      cache_read: 0.11
      cache_write: 1.375
      status: verified
      retrieved_on: "2026-10-06"
      source: >-
        AWS Price List API, service code AmazonBedrockFoundationModels,
        servicename "Claude Haiku 4.5 (Amazon Bedrock Edition)", regionCode
        us-east-1, Regional usagetypes USE1-MP:USE1_InputTokenCount,
        _OutputTokenCount, _CacheReadInputTokenCount, _CacheWriteInputTokenCount,
        list 20260930001912, effective 2026-09-01; the same five rates appear
        under service code AmazonBedrockService "Claude Haiku 4.5" (list
        20260930223049).
    us.anthropic.claude-sonnet-5-5:
      input: 2.20
      output: 11.00
      cache_read: 0.22
      cache_write: 2.75
      status: verified
      retrieved_on: "2026-10-06"
      source: >-
        AWS Price List API, service code AmazonBedrockFoundationModels,
        servicename "Claude Sonnet 5.5 (Amazon Bedrock Edition)", regionCode
        us-east-1, usagetypes USE1-MP:USE1_input_tokens_standard,
        output_tokens_standard, cache_read_tokens_standard,
        cache_write_tokens_standard, list 20260930001912, effective 2026-09-01.
    us.amazon.nova-lite-v1:0:
      input: 0.06
      output: 0.24
      cache_read: 0.015
      cache_write: 0.00
      status: verified
      retrieved_on: "2026-10-06"
      source: >-
        AWS Price List API, service code AmazonBedrock, model "Nova Lite",
        regionCode us-east-1, feature "On-demand Inference", usagetypes
        USE1-NovaLite-input-tokens, -output-tokens, -cache-read-input-token-count,
        -cache-write-input-token-count, list 20261005210410, effective 2026-10-01.
    us.amazon.nova-pro-v1:0:
      input: 0.80
      output: 3.20
      cache_read: 0.20
      cache_write: 0.00
      status: verified
      retrieved_on: "2026-10-06"
      source: >-
        AWS Price List API, service code AmazonBedrock, model "Nova Pro",
        regionCode us-east-1, feature "On-demand Inference", usagetypes
        USE1-NovaPro-input-tokens, -output-tokens, -cache-read-input-token-count,
        -cache-write-input-token-count, list 20261005210410, effective 2026-10-01.
    amazon.titan-embed-text-v2:0:
      input: 0.02
      output: null
      cache_read: null
      cache_write: null
      status: verified
