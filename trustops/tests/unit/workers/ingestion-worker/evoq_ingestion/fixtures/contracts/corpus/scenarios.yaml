# AEO shared test corpus — scenario matrix (plan §3.3).
#
# Consumed as DATA by both engines and by golden.py; neither engine imports the other.
# Fixtures are produced by generate_corpus.py (seed 20260911, byte-identical on every run).
#
# Row shape (every key under `expected` is optional; `null` = "not pinned yet", see `todo`):
#
#   id:          PDF-01 … CTX-04 (also REAL-NN from real/*.yaml sidecars)
#   file:        path relative to this directory (generated/…, generated/edge/…, ctx/…)
#   format:      pdf | docx | xlsx | csv | pptx | md | txt | confluence_storage_xhtml |
#                confluence_export_view_html | jira_issue_json | markdown_canonical (chunk-only) |
#                binary | unsupported | symlink
#   tags:        free-form
#   size_class:  tiny | small | medium | large
#   on_demand:   true when the file is not committed (generate_corpus.py --edge)
#   invoke:      file (default) | folder  — `folder` runs the ingestion CLI over the parent dir and
#                picks this row's document by file_name (scanner-level behaviour such as symlinks)
#   engine_args: extra CLI args for the ingestion engine (EDGE-07)
#   expected:
#     canonical:                          # ingestion engine — Canonical Document contract
#       status:        COMPLETE | FAILED | UNSUPPORTED | [any, of]
#       codes:         [required codes]   # lower_snake names from evoq_ingestion/core/codes.py; an
#                                         # entry matches `code` or `code:detail`; checked against
#                                         # extraction.warnings + failure_code
#       codes_absent:  [forbidden codes]
#       codes_any_of:  [at least one of]
#       structure:     {field: [min, max] | exact | null}          # structure.* counts
#       requirement_ids: [ids…] | [{prefix, start, end, width?}] | null   # exact, document order
#       markers:       {page|sheet|slide|comment: [min, max]}    # count of marker lines in body
#       body:          {contains: [], not_contains: [], max_occurrences: {}, min_occurrences: {},
#                       regex_counts: {pattern: [min, max]}}      # multi-line regex over body
#       fields:        {top_level_field: exact_value}
#       content_hash_equals: <other id>                           # EDGE-06
#     chunking:                           # context engine — python -m evoq_context chunk --json
#       strategy:      heading_sections | paragraph_windows | page_windows | slide_units |
#                      table_aware | requirement_units | comment_thread | null
#       children:      [min, max]         # level-1 chunks (embedded)
#       parents:       [min, max]         # level-0 stored-only parents
#       req_coverage_pct:   % of the document's requirement ids present in some child's requirement_ids
#       section_path_pct:   % of children carrying section_path
#       page_pct / sheet_pct / slide_pct: % of children carrying page / sheet / slide
#       hard_max_violations: 0            # children with token_estimate > CHUNK_HARD_MAX_TOKENS
#       topics_min:    n                  # distinct topic_id values (topic refiner)
#       same_texts_as: <other id>         # EDGE-06: identical child texts
#   todo:        why an expectation is still null / provisional

schema_version: 1
seed: 20260911
codes_owner: aeoingestionjob/evoq_ingestion/core/codes.py
requirement_id_pattern: '\b([A-Z][A-Z0-9]{1,12}(?:-[A-Z0-9]{1,12})*-\d{1,5})\b'
chunk_defaults: {target: 350, overlap: 50, min: 80, hard_max: 2000, parent_max: 1500}
strategies: [heading_sections, paragraph_windows, page_windows, slide_units, table_aware, requirement_units, comment_thread]

scenarios:

  # ───────────────────────────── PDF ─────────────────────────────
  - id: PDF-01
    file: generated/PDF-01_single_column_headings.pdf
    format: pdf
    tags: [pdf, headings, font-size-inference, single-column]
    size_class: small
    description: Single-column PDF; headings only distinguishable by font size (20/16/13 pt bold vs 10 pt body).
    expected:
      canonical:
        status: COMPLETE
        codes: [inferred_headings]
        codes_absent: [scanned_pdf_no_ocr, multi_column_detected, encrypted_pdf, corrupt_file]
        structure: {heading_count: [6, 12], page_count: [2, 2], table_count: [0, 0]}
        requirement_ids: []
        markers: {page: [2, 2]}
        body: {contains: ["Ledger Service Design Notes", "Posting Pipeline", "Reconciliation"]}
      chunking:
        strategy: heading_sections
        children: [4, 24]
        parents: [0, 12]
        req_coverage_pct: null
        section_path_pct: 100
        page_pct: 100
        hard_max_violations: 0

