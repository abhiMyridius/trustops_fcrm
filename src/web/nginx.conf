# W1 web container's own nginx (distinct from the G1 gateway's
# ops/nginx/default.conf, which reverse-proxies to this on :80). Serves
# the static Vite build and falls back to index.html for client-side
# routes (React Router 7), so a hard refresh on e.g. /analyst/cases/123
# still resolves.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # docker-compose.yaml's own healthcheck just GETs "/"; this also gives
    # a dependency-free liveness path consistent with every other
    # container's /healthz.
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets are content-hashed; cache them hard. index.html itself
    # is not matched by this location (it has no hash) so it always
    # revalidates and new deploys are picked up on next load.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
