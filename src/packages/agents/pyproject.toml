[project]
name = "fcrm-agents"
version = "0.1.0"
description = "P1: the nine agents' registry (AgentSpec), per-agent context-pack builders, the Bedrock FallbackModel factory per tier (ADR-04), and an offline runtime (Pydantic AI FunctionModel) that runs one agent job through the real guard chain. Design B §2, §3, §5; BUILD-PLAN §3.4."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
  "fcrm-guardrails",
  "fcrm-tools",
  "fcrm-prompts",
  "fcrm-seed",
  "pydantic>=2.9",
  "pydantic-ai-slim[bedrock]>=2.53",
]

[project.scripts]
fcrm-agent = "fcrm_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_agents"]
