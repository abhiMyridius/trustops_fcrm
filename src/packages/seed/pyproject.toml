[project]
name = "fcrm-seed"
version = "0.1.0"
description = "P7: the single generated dataset every service, test and eval reads (ADR-16). seed.json is produced by gen_seed.py from the approved walkthrough-v2 seed; this package also loads it into Mongo on first boot."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_seed"]

[tool.hatch.build.targets.wheel.force-include]
"fcrm_seed/seed.json" = "fcrm_seed/seed.json"
