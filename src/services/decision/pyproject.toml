[project]
name = "fcrm-decision-service"
version = "0.1.0"
description = "S5 decision-service: frozen pack snapshots, hidden votes, tally (ADR-08, via fcrm_contracts.voting), outcomes, R6 threads/addenda/pack-v2/re-vote. fcrm_decision.packs and .release_checks are pure; FastAPI routes and the Mongo-backed store now land in fcrm_decision.routes/.store, mirroring fcrm_scoring's shape."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
  "fcrm-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "mypy>=1.14",
  "hypothesis>=6.123",
  "httpx>=0.28",
  "fcrm-seed",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_decision"]
