[project]
name = "fcrm-decision-service"
version = "0.1.0"
description = "S5 decision-service: frozen pack snapshots, hidden votes, tally (ADR-08, via fcrm_contracts.voting), outcomes, R6 threads/addenda/pack-v2/re-vote. fcrm_decision.packs and .release_checks are pure; the Mongo-backed routes land once fcrm_common exists."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.14", "hypothesis>=6.123", "fcrm-seed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_decision"]
