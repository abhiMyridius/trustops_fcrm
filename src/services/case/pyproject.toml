[project]
name = "fcrm-case-service"
version = "0.1.0"
description = "S1 case-service: cases, submission versions, fields, documents, review items, clarification threads, conditions, SSE. fcrm_case.domain is pure business logic with no I/O; the HTTP routes and Mongo repositories are added once fcrm_common lands."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.14", "hypothesis>=6.123", "fcrm-seed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_case"]
