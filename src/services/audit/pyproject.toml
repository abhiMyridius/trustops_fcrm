[project]
name = "fcrm-audit-service"
version = "0.1.0"
description = "S4 audit-service: the evidence ledger (proposals) and the hash-chained, append-only audit_records. fcrm_audit.chain is pure and has no I/O; it is the only place a chain hash is ever computed (design A §2.4)."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
]
# fcrm-common, fastapi, uvicorn and the Mongo repository wiring are added
# once fcrm_common lands; the hash-chain core has no I/O dependency at all.

[dependency-groups]
# fcrm-seed is test-only here (see fcrm_audit/seedmodel.py's docstring): the
# live service never seeds the demo case's audit trail, only tests replay it.
dev = ["pytest>=8.3", "mypy>=1.14", "hypothesis>=6.123", "fcrm-seed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_audit"]
