[project]
name = "fcrm-policy-service"
version = "0.1.0"
description = "S3 policy-service: corpus, clauses, controls, jurisdictions, field sets, precedents, hybrid search over S3 Vectors + Mongo text. fcrm_policy.search.rrf is pure; the S3 Vectors client, Mongo text index and H4 context-worker wiring land once fcrm_common exists."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.14", "hypothesis>=6.123", "fcrm-seed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_policy"]
