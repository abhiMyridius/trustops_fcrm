[project]
name = "fcrm-scoring-service"
version = "0.1.0"
description = "S2 scoring-service: the deterministic engine (fcrm_scoring.engine) plus FastAPI routes, ScoringModelVersion/RoutingRulesVersion storage and the startup recompute self-test. No agent ever calls this package's engine directly without going through POST /score (ADR-07)."
requires-python = ">=3.13"
dependencies = [
  "fcrm-contracts",
  "fcrm-seed",
  "fcrm-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "mypy>=1.14", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcrm_scoring"]
